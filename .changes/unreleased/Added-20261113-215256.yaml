kind: Added
body: 'The run service, the broker (its long poll, the Dagger engine''s queries) and the Gitea and Forgejo client go through the network library (`broker.request` on `net_client`): one pool, one CA load, one `request:` line implementation, redirects and the stale-connection retry in the library; the runner''s std HTTP client now serves only the live feed (moved in R6). Differences: a redirect of a request with a body is followed (a 302 of a POST becomes a GET; a streamed body refuses a redirect) where std handed the 3xx back, the User-Agent is zig-runner/<version>, errors carry the library''s names (DnsFailed, NetworkIo, TooManyRedirects), no Accept-Encoding is sent, and the request: line shows the port of an explicit one in every call'
