kind: Fixed
body: 'The native backend on its first real host (razorbill: a Raspberry Pi with Tailscale): a root runner''s jobs had no DNS when the host''s resolver is not behind its default route (Tailscale''s MagicDNS, 100.100.100.100 through `tailscale0`), so provisioning failed (`Unable to locate package build-essential`). Each job now gets a resolv.conf of its own, made from the host''s as Docker makes a container''s (no loopback or IPv6 nameservers, search domains and options kept, systemd-resolved''s upstreams behind its stub, Google''s public resolvers when nothing else is left, which "Set up job" then says), and the jobs'' firewall lets UDP and TCP to port 53 of those nameservers out of whichever interface the host routes them by, and nothing else there; the rules follow the host''s resolver when it changes. Native image pulls failed with `HttpConnectionClosing` once the process''s HTTP client kept a connection Docker Hub had closed after a minute idle: a request on such a connection is now sent again on another, a bounded number of times. And a native set-up that fails before any step (the pull, provisioning, the base, the job''s store, cgroup, slot or network) now sends the job to Dagger with the reason in "Set up job", as other unsupported cases do, instead of failing it; a cancelled job does not, and the memory gate measures the job on the engine again.'
