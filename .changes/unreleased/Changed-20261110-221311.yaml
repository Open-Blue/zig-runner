kind: Changed
body: 'The native backend makes a job''s network namespace beside the job''s image and caches instead of before them, and no longer asks the kernel to change a bridge that is already as wanted: with seven jobs starting together on a Raspberry Pi 5 the `netns` phase (33-130 ms each, 8 ms for one job) is off the job''s critical path.'
