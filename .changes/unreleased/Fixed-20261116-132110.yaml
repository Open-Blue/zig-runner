kind: Fixed
body: The Dockerfile oracle's bases.txt pins alpine 3.24, as its fixtures do since Renovate moved them (#580); it still named 3.22, so the oracle looked for a base it had not prepared. Renovate's rule for bases.txt never matched (its ^...$ anchors apply to the whole file, which holds two lines) and is fixed.
