kind: Fixed
body: 'The release''s aarch64 binary links again on runners without Rust 1.99.1 (GitHub''s ubuntu26 image of 2026-11-16 on): install-rust.sh, sourced by build-zr-net.sh, set its own arch to the machine''s and so replaced the build''s, which then built the network library for x86_64 again and copied it under the aarch64 name (the link failed on every object, "incompatible with aarch64linux"). The installers'' variables are now rust_-prefixed, build-zr-net.sh makes what it was asked for read-only (a sourced script that assigns it fails at once, by name) and checks the archive''s ELF machine before handing it on. The job''s log now says, for each build, the architecture asked for, cargo''s target, which cargo from where, whether Rust was reused or unpacked, and the archive''s architecture, member count and SHA-256.'
time: 2026-11-19T01:21:01.590164566-05:00
