kind: Fixed
body: 'Action and repository tarballs (an image with no git) are downloaded through the network library, as every other download is, which removes the last download that used Zig''s std HTTP client. The token still goes to the first origin only, and the retries of a busy server and a lost connection are kept. Against before: only 301, 302, 303, 307 and 308 are followed (it was any 3xx with a Location); a redirect from https to http is refused (it was followed with the token dropped); a connection cut in the middle of the archive is now tried again when 64 MiB or less had arrived (a cut body was never retried; above 64 MiB it still is not); a TLS handshake the peer breaks with malformed or unexpected records (no shared protocol or cipher, or a captive portal answering plain HTTP on port 443) is no longer retried; the whole download and its retries share the 15 minutes; each attempt writes its own request: line, with retry= counting the attempts'
