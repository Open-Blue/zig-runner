kind: Fixed
body: 'The runner builds again on a machine with libunwind''s development package installed (Ubuntu''s libunwind-dev): the build asked pkg-config for libunwind, which added the host''s glibc include directory (-I/usr/include/x86_64-linux-gnu) to a musl build, and the vendored zstd and zlib-ng failed to compile with 37 errors. The build now links Zig''s own libunwind without asking pkg-config.'
time: 2026-11-19T22:02:56.782213469-05:00
