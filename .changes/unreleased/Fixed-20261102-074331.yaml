kind: Fixed
body: 'A Dockerfile build''s layer is now published under its key''s lock, as a step''s layer is: another runner''s store cleanup took the layer''s temporary entry for one a dead runner left and removed it while it was being published, so the build lost its layer or, worse, published it with part of its files gone, for a later job to mount. The store now refuses to publish without the key''s lock. A new stress test runs six processes against one native store under a small cap for 30 seconds (rootless and as root, on x86_64 and arm64; ten minutes with eight processes in the nightly analysis workflow), each running jobs and Dockerfile builds on overlapping keys, and checks that every replay matches the live run that stored it, no job sees an evicted or half-published layer, every entry stays whole, no key runs in two jobs at once, no fd or lock leaks, and a last collect leaves no temporary entry and the store within its cap.'
