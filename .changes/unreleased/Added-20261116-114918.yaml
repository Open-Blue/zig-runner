kind: Added
body: 'Gitea and Forgejo services: a service''s own cmd: (Gitea''s field) starts the image''s entrypoint with those arguments on the native backend, instead of being dropped, and a Gitea task''s services are tested end to end on the native backend (by name, on localhost, health check, teardown) (#520, G6). The Dagger backend logs that it ignores cmd. See docs/GITEA.md.'
