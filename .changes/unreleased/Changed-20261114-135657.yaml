kind: Changed
body: 'A native job container''s `--memory-swap` now sets the job''s own `memory.swap.max` as Docker reads it (0 by default and when equal to `--memory`; the difference when larger; `max` for -1), up to what `RUNNER_NATIVE_SWAP` allows: where jobs may not swap it is capped to 0 and "Set up job" says so. A `--cpus` or `--cpu-quota` above the kernel''s maximum, and a `--cpuset-cpus` list past 8192 ids on big machines, are now handled (refused with the flag named, and accepted).'
time: 2026-11-14T13:56:57.295902152-05:00
