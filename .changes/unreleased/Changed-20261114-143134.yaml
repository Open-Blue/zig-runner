kind: Changed
body: 'No swap unless asked: every native job with a cgroup now has its own `memory.swap.max` at 0, container options or not, and only its `--memory-swap` raises it. `RUNNER_NATIVE_SWAP=true` now means jobs may ask for swap (false still caps every job to 0). A job whose swap is 0 gets no `memory.high`, so with `RUNNER_NATIVE_SWAP=true` no job has one unless it is set another way.'
