kind: Changed
body: 'No swap unless asked: every native job with a cgroup now has its own `memory.swap.max` at 0, container options or not, and only its `--memory-swap` raises it. `RUNNER_NATIVE_SWAP=true` now means jobs may ask for swap (false still caps every job to 0). `memory.high` is set only for a job that has swap (on a machine that has some): a job that asks for swap with `--memory-swap` gets the gate's, and a job with swap 0 gets none.'
