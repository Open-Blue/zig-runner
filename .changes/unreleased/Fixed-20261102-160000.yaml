kind: Fixed
body: 'A problem matcher''s pattern with a lookbehind no longer crashes the runner ("integer overflow") on a log line that is not valid UTF-8: a backreference compared bytes, so a lone 0xC3 matched the first byte of "À" and ended inside it, and a step back from there (`(?=.(.))\1(?<=.)` on C3 80 C3) went past the start of the line. Backreferences now compare whole characters, as .NET does, and a step back from inside a character takes the byte before as a character of its own, never more than the text before it. Found by the nightly fuzzer; its input is a seed now, the case is in the .NET comparison''s fixed cases, and tests cover lookbehinds and backreferences (folded or not) that do not fit before or after where they are tried.'
