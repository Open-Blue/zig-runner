kind: Added
body: 'A native job''s Docker API builds images (#448, stage 1b): with RUNNER_NATIVE_DOCKER_API=true, a step''s docker CLI runs ''docker build'' (the classic builder: -f, -t, --build-arg, --label, --target, --no-cache, -q, FROM an image built earlier in the job) against the runner''s own Dockerfile builder, in the job''s cgroup, with its layers in the shared store under the job''s trust scope, and ''docker image inspect'', ''docker tag'' and ''docker rmi'' over a per-job tag index that is the job''s memory alone. Builds stream Docker''s own lines, a failed RUN ends with a clear error, and a client that leaves cancels its RUN. The API answers only while a step''s process runs, so every request is counted against the step that made it (a step that used it is still not stored for replay). With an engine configured, a job whose scripts use docker run, compose, push, pull, buildx or a docker/ action still runs on Dagger. Off by default; nothing changes while it is off. See docs/OPERATIONS.md and docs/native-backend.md.'
