kind: Security
body: 'A native job on a root runner can no longer send packets as another job: each job''s port on the jobs'' bridge has a table of its own in the nftables bridge family (zig_runner_pin<slot>) that drops IPv4 whose source is not the job''s address, and ARP whose sender is not, before anything is routed or forwarded (#603). The job''s network helper makes it before the port exists and in the host''s namespace, and fails the job''s network if it cannot (a kernel without nf_tables_bridge); the job''s teardown removes it, and a crash''s leftover is replaced by the slot''s next job. Root tests on the wire send spoofed TCP and ARP as another job''s address, with and without the pin, and check a real job''s pin is on the host while it runs and gone after.'
