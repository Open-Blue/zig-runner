kind: Fixed
body: 'The runner''s own git fetches (the native checkout and action fetches) run with git''s automatic maintenance and gc off: git 2.48 and later start maintenance in the background after a fetch, which took .git/objects/maintenance.lock under the checkout''s timestamp pass (touch: setting times of ''./.git/objects/maintenance.lock'': No such file or directory) and could write a fetched layer after its step ended. A job''s own git keeps its defaults.'
