kind: Fixed
body: 'A runner with a GitHub App no longer exits at its start when its first token request fails on the network: a failed name lookup, a refused or reset connection, or GitHub answering 5xx or 429 is tried again after 1, 2, 4, 8 and 16 s (one github_app_retry warning each), and a stop signal ends the wait. Only a refusal (4xx) still gives the hint about the App''s installation; a network failure that outlasts the retries says to check DNS and the network instead. Before, one DNS miss on a GitHub-hosted VM stopped the e2e suite''s runner, its jobs stayed queued and the hint blamed the App. The e2e suite now fails as soon as the runner it started has exited, with the last of its log, instead of waiting out each run''s timeout.'
