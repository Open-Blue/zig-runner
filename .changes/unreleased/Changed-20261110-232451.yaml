kind: Changed
body: 'A job''s last layer is renamed into the native store without waiting for its data to reach the disk, and is made durable in the job''s teardown, after its result is reported (a pending mark naming the boot, refused in any other); the way a layer is synced (its own files or one syncfs) is chosen by the disk''s I/O pressure and dirty data. A reported job may now lose its last layer to a power cut before its teardown sync: a clean cache miss.'
