kind: Added
body: 'Deploy channels (#550): every push to main and every tag vX.Y.Z-rcN is built, attested and published as a GitHub pre-release (the `candidate` workflow: main-N-SHA12, with binaries saying vX.Y.Z-main.N+SHA12; never latest), and zig-runner-deploy follows a channel per agent (`CHANNEL=stable|rc|main`, `zig-runner-deploy@.service` for a second pool beside the stable one) with the same checksum and provenance checks against the right workflow, ref and commit, a version monotonic within the channel, and an explicit, logged switch between channels. `stable`, the default, installs releases only and refuses a candidate (tested against hostile feeds and deployment orders). Candidates are pruned past a retention window (14 days, `CANDIDATE_RETENTION_DAYS`; the newest `CANDIDATE_KEEP`=20 of each kind and what the rc pool is deployed from stay; `candidate-prune` daily, with a dry run). A release candidate also gets an image (`:vX.Y.Z-rcN`, and `:rc` while it is the newest; never `:latest`) and a deployment record to `razorbill-rc`; a main candidate has neither. docs/OPERATIONS.md has a "Channels" section'
