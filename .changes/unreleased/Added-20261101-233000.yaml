kind: Added
body: 'Zig-specific analysis of the runner''s own code, which CodeQL and Semgrep cannot read: ZLint (pinned, checksum-checked) on every pull request ("Lint (ZLint)", with the rules that find bugs, `runner/zlint.json`); and a nightly `analysis` workflow that fuzzes each parser in `runner/src/fuzz.zig` with Zig''s coverage-guided fuzzer, now including an image layer''s tar, PAX and paths applied beside a directory it must never reach, image references and registry challenges, manifests and minisign signatures (each corpus kept in the Actions cache; a crash, failed check, leak or hang fails the job named after its target, with the input as an artifact), and runs every test under Valgrind''s memcheck. `zig build test` runs the fuzz targets over their seed corpus every time; `zig build test -Dllvm --fuzz` fuzzes locally.'
