kind: Added
body: 'The live log feed runs on the network library (tokio-tungstenite on the same connection, proxy and CA policy as every request, with a request: line for the upgrade); ping, pong and the close handshake are handled there and sending is bounded with backpressure. A message is now accepted when it is queued, not when it is in the kernel''s buffer: a lost connection loses the queue (at most 64 KiB), the message being written, the library''s write buffer (at most 64 KiB) and the kernel''s buffer, and the live log feed lost line says how many queued messages were never sent; the job''s log is uploaded whole either way. The upgrade request now sends User-Agent zig-runner/<version>. Rust lints (clippy, no unwrap, expect or panicking index) are enforced in CI. The std client version of the feed stays as a test oracle until its removal'
