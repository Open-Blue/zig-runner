kind: Fixed
body: 'Action and checkout fetches retry a network failure: a `uses:` action''s fetch and the checkout step''s git (clone, tags, submodules), tarball download or Dagger fetch that fails on a DNS lookup, a refused or reset connection, a TLS failure or timeout, or a 5xx/429 is tried again, up to 5 attempts 4, 8, 16 and 32 s apart (each wait a random half to all of that), within a 180 s budget per job; a stalled transfer ends after 30 s, and no attempt that is still moving bytes is stopped before 15 minutes. Each retry is a redacted warning in the job log as it happens; the failed attempt''s partial tree is dropped, and only a layer that attempt made. A missing repository or ref and refused credentials still fail at once, and a job''s cancel or timeout ends the waiting. actions/runner tries 3 times, 10 to 30 s apart.'
