kind: Security
body: 'Fuzz targets and property checks for the text paths that guard secrets and a job''s environment, run nightly by the `analysis` workflow, and the bugs they and their review found, each fixed: a GITHUB_OUTPUT or step summary value holding `::zig-file-command::env` lines was read as the step''s GITHUB_ENV (setting BASH_ENV ran code in later steps), now each file command''s part carries its length; a heredoc value''s `EOF\r` line ended a value delimited by `EOF`, so the lines after it set more variables, now file commands are read exactly as GitHub''s runner reads them on Linux (a CRLF file''s values keep their `\r`); overlapping secrets left most of one shown (`***cdef`), now they are masked as one span as GitHub masks them; secrets were not masked in base64 at an offset (`base64(user:password)`) or the other forms GitHub''s runner masks (command line, expression and XML escapes, inside double quotes, PowerShell''s halves); a secret across the cut of a line longer than 1 MiB was shown half on each line, and a long `::add-mask::` line was cut and its tail shown; and the engine''s HTTP/2 connection kept CONTINUATION frames without end (a memory flood) and read frames past the 16 KiB a peer may send.'
time: 2026-11-02T20:00:00.000000-05:00
