kind: Added
body: 'Job priority, a feature GitHub Actions does not have (prototype). A job gets a level from a policy file (`RUNNER_PRIORITY_POLICY`: `high repo=o/r event=push ref=refs/heads/main`), its own `ZIG_RUNNER_PRIORITY` env (capped, and at the default level for jobs the runner does not vouch for), or the pool default. Jobs waiting for room at the memory gate start by level, a job rising one level for each `RUNNER_PRIORITY_AGE_SECS` it waits so none starves (the bound is `(9 - level)` steps), with the #415 backfill unchanged. Native jobs get `cpu.weight`, `io.weight` and (high) `memory.low` by level, and with `RUNNER_PRIORITY_FREEZE` the steps of lower jobs are frozen under memory pressure while a higher one runs, never longer than `RUNNER_PRIORITY_FREEZE_MAX_SECS`. Nothing changes while every job has the default level.'
