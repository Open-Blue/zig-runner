kind: Added
body: 'Native steps (`RUNNER_BACKEND=native`) share stored layers across slots on a root runner: a layer is published with the canonical ids (the ids the job''s namespace saw, 0 to 65535; any other host id becomes the overflow id; set-id bits, file capabilities and ACLs kept), and each step mounts the stored layers idmapped onto its own job''s range, read-only, nosuid and nodev, as it already did the rootfs and the Zig cache seeds. The slot left the step store''s key (the store''s format is now 3, so older layers age out), so a rerun replays whichever slot it lands in, where before it mostly missed in a busy pool. Root and rootless runners keep separate keys; rootless runners are unchanged. Native stays off by default; the Dagger backend is unchanged.'
