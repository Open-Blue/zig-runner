kind: Changed
body: A native job's result is reported to GitHub before the job is torn down. Its teardown (the store's eviction, the network, the cgroup, the job's directory) used to run first, so every job's completion waited for it; it now runs right after the result is sent and before the runner polls again, holding the job's slot, network and memory reservation until it ends, so a following job never meets what it still holds.
