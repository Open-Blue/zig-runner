kind: Fixed
body: 'What ZLint''s first run and the new fuzzing found: the database writer went on writing its whole queue after `close` gave up waiting for it (the cancel was swallowed), so a slow database held the runner''s exit for a statement timeout per queued row; a runner held at the memory gate, or backing off after a failed registration, ignored the pool''s cancel when another runner could not start, so the runner did not exit; and a workflow command the runner had no memory to carry out (`set-output`, `save-state`, `set-env`, `add-path`, `add-mask`, `stop-commands`) was dropped silently, where it now fails the step. `hashFiles()` with a pattern whose implicit descendants GitHub refuses (`hashFiles(''\.'')`, found by the new fuzzing) crashed the runner, every job on it included; it now fails as GitHub''s does ("Relative pathing ''.'' and ''..'' is not allowed"). Unused declarations removed.'
