kind: Added
body: 'Native `services:`, behind `RUNNER_BACKEND=native` on a root runner: each service runs as a long-running sandbox of the runner''s own (its own mount, PID, UTS and IPC namespaces, the job''s ids, Docker''s capabilities and seccomp filter, a fresh overlay over its image) in the job''s network namespace, which the steps share; steps reach it by name and on `localhost` at each published port (a TCP relay of the runner''s own when the numbers differ). A service is ready when its health check passes (`--health-cmd` and the other `--health-*` options, or the image''s `HEALTHCHECK`), run inside the service, or else when its ports accept connections, as on the Dagger path; "Stop containers" stops it and prints its logs. Images come from the native image pull, with the service's credentials; a job whose service image is given by an expression runs on Dagger. Each service and its port relay run in the job's cgroup. The jobs'' NAT rules now also drop what goes to `zr0` and is not a reply, so neither the host nor anything it routes reaches a job''s services. docs/native-backend.md has the measurements and what this taught.'
