kind: Added
body: 'More race detection. The nightly `analysis` workflow runs the native backend''s tests under ThreadSanitizer on x86_64 and arm64, rootless and as root with the service images ("ThreadSanitizer, native"), with the runner binary they start for each step (`zig-runner native-step`) built with it too, as `ZIG_TEST_SANITIZE_THREAD=1` now builds it; and the end-to-end suite on both backends with a runner built under ThreadSanitizer ("ThreadSanitizer, end to end", `e2e.sh build BIN tsan`), failing on any report in the runner''s log or the jobs'' (`e2e.sh races`). TSan''s runtime needs glibc''s dynamic loader, so these builds are dynamically linked PIEs: the release''s static PIE crashes at startup with it. "Go tools" runs `go test -race` and a race build of each module under `runner/tools`, and runs rsadiff, the one tool with goroutines of its own, with that build.'
