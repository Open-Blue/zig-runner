kind: Fixed
body: 'Running out of memory is reported as that, never read as an answer: a broker message is no longer ignored as one of type `''''` (a job request dropped), `if: always()` after a failed step no longer skips the step, a valid `fromJSON()` argument is no longer "invalid JSON", a regular expression''s `(?(...)...)` is no longer refused, a numeric `github.run_id` is no longer left empty, and an image''s manifest, index or config is no longer "not one" (nor a just-unpacked image "lost by the store"). Found by new allocation-failure tests (`runner/src/alloc_failures.zig`, `std.testing.checkAllAllocationFailures` and a one-failure-at-a-time variant) over YAML, expressions, regular expressions, HPACK, hashFiles, the job and broker messages, OCI references, manifests and configs, tar and PAX headers and a whole layer. The `@bitCast` uses were audited against Zig 0.17''s new definition (one, an address array cast to an integer, now reads the bytes directly), and CI counts the casts and assertions that skip Zig''s checks against a checked-in baseline (`.github/scripts/unsafe-ratchet.sh`).'
