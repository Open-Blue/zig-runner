kind: Added
body: 'Gitea and Forgejo artifacts go through the instance (#520, G5): action steps get ACTIONS_RUNTIME_URL, ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN (the task''s runtime token, masked in the log; the job''s own token when an older instance sends none, as act_runner does, and the log says which) as act_runner sets them, so artifact actions that take a Gitea or Forgejo server (forgejo/upload-artifact@v4 and download-artifact@v4) upload to and download from the instance. actions/cache stays a no-op there, as documented (docs/GITEA.md, which also says what the runtime token can do on the instance); the live Gitea and Forgejo CI jobs upload and download an artifact.'
