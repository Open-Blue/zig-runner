kind: Fixed
body: 'Action fetches retry a network failure: a `uses:` action whose git fetch (or tarball download, or Dagger fetch) fails on a DNS lookup, a refused or reset connection, a TLS timeout or a 5xx/429 is tried again, up to 5 attempts 4, 8, 16 and 32 s apart (each wait a random half to all of that), each retry logged in Set up job as a warning with the error and the failed attempt''s partial tree dropped first. A missing repository or ref and refused credentials still fail at once, and a job''s cancel or timeout ends the waiting. actions/runner tries 3 times, 10 to 30 s apart.'
