kind: Changed
body: 'Native jobs of a runner process that end together make their last layers durable with one shared syncfs instead of one each (seven jobs ending in a burst synced the Pi''s SD card seven times, 5-8 s each beside a writer): the first waits up to RUNNER_NATIVE_SETTLE_WINDOW_MS (100 by default, 0 for the old way) for the other jobs whose ends have begun, none when it ends alone, and jobs that end while its syncfs runs share the next. The sync goes through a descriptor the process opens before any job''s, so a write error is still reported to every job it may concern; a failure refuses every layer of the batch, as a job''s own failed sync does. The settle stays in the teardown, out of the job''s reported time; the SPIN model of the deferred sync has the batch, and a mutant that marks a layer durable before its batch''s sync fails it.'
