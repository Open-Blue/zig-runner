kind: Fixed
body: 'spin.sh''s progress heartbeat ends with the script on every path: an EXIT trap (and INT, TERM) kills it, and its loop exits at its next tick once the script is gone, so a script killed by SIGKILL or ended with its parent (a pre-push hook) no longer leaves one running for hours'
