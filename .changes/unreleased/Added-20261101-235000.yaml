kind: Added
body: 'The Lean proofs'' CI (proofs.yml) has three gates where it had one plain `lake build`: `lake build --wfail`, so a `sorry` (a warning until now) or any other warning fails the check; `lake env leanchecker`, which replays every declaration of the `Runner` and `Glob` libraries and the oracles in the kernel from the built `.olean` files; and `proofs/Axioms.lean`, which fails when any declaration in `Runner` or `Glob` depends on an axiom outside its allow list (`propext` and `Quot.sound`, what the proofs use today: no `Classical.choice`, `sorryAx` or `Lean.ofReduceBool`), when a module there declares an axiom, or when one of the 61 main theorems it names is missing, and prints `#print axioms` for each of them. No theorem changed; proofs/README.md documents the gates. The runner itself is unchanged.'
