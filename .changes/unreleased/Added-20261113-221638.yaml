kind: Added
body: 'Container `options:` `--cpu-shares` (as `cpu.weight`), `--cpuset-cpus` and `--cpuset-mems` (as `cpuset.cpus` and `cpuset.mems`, checked against what the machine allows), `--pids-limit` (lowers `pids.max`, never raises it) and `--memory-swap` (as the job''s own `memory.swap.max`, see the Changed entry) no longer send a native job to Dagger. Deliberate differences from Docker: `--cpus` above the machine''s CPU count is accepted and never throttles, a negative `--cpu-quota` is no quota, and `--cpu-shares` becomes a weight as systemd converts it (1024 shares is the default weight 100; runc''s formula gives 39) so a job that asks for the default competes as an equal.'
