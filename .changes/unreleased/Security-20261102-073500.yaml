kind: Security
body: 'A new `security` workflow scans for secrets and checks dependencies. "Secrets" runs gitleaks (pinned by version and checksum, `.github/scripts/install-gitleaks.sh`) over each pull request''s own commits and weekly over `main`''s whole history, failing on any finding and never printing the value; the one finding in the history so far, a test''s made-up layer key in `runner/src/native/layers.zig`, is allowed in `.gitleaks.toml`, narrowly and with why, and `gitleaks:allow` comments are ignored. "Dependency review" fails a pull request that brings a dependency with a known vulnerability of moderate severity or worse, or a license outside the permissive ones (MIT, Apache-2.0, BSD, ISC, Zlib, Unicode), as GitHub''s dependency graph sees them: the Go tools'' modules and the workflows'' actions, not `runner/build.zig.zon` or pinned images. Renovate follows gitleaks'' version.'
time: 2026-11-02T07:35:00.000000-05:00
