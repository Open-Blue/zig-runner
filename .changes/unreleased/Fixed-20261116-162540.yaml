kind: Fixed
body: 'Gitea and Forgejo action trees: an action from a server other than the job''s default one is mounted under a directory named by the server''s whole URL (http and https of one host are two trees), and its ref''s slash no longer nests one tree''s directory in another''s (o/r@a/b and o/r@a are two directories, whichever is fetched first). The default server keeps GitHub''s path, github.action_path unchanged, where o/r@a/b is a directory inside o/r@a''s as before; a fetch never deletes a directory, so both trees are there whichever is fetched first; the Dagger path mounts the same way, so two servers'' o/r@v1 no longer share one mount and run the first one''s code; directory names made from a ref or a host are escaped injectively (h:80 and h_80 differ), and the host of an absolute URL in uses: must be a host name or IPv4 address and an optional port (#520, G5).'
