kind: Fixed
body: 'A native runner whose binary a deployment replaced while it kept running (an instance not in zig-runner-deploy''s `UNITS`, as razorbill''s zig-runner@bench.service was) now goes on running native jobs: it took its own path from /proc/self/exe for each job, which then reads "/usr/local/bin/zig-runner (deleted)", and every job fell back to Dagger with "could not make the job''s sandbox: FileNotFound" when its network helper could not be started. Its helpers now run /proc/<pid>/exe, the binary it started from, until it restarts, and "Set up job" says so; a rootless runner that starts its helpers under `unshare`, which cannot run that, sends its jobs to Dagger saying why. Every native set-up failure now says what failed and on which path ("starting the job''s network helper /usr/local/bin/zig-runner (deleted): FileNotFound"), not the error''s name alone. A test replaces a running runner''s binary as the deployment does and runs a native job on it, in both native passes.'
time: 2026-11-02T14:00:00.000000-05:00
