kind: Security
body: 'Native steps (`RUNNER_BACKEND=native`): the seccomp filter is now Docker''s default profile as an allow list, for x86_64 and aarch64 (a call it does not name gets EPERM, one newer than it ENOSYS; `clone` without namespace flags, `personality` and `socket` limited to Docker''s values), instead of a deny list. The jobs'' NAT and firewall rules are made over nftables netlink instead of with `iptables`, in a table of the runner''s own (`ip zig_runner`) that forwards the jobs'' traffic only out through the host''s uplinks, plus `-i zr0`/`-o zr0` accepts in the host''s iptables-nft `FORWARD` and `DOCKER-USER` chains; P1''s iptables rules are replaced. No `iptables` binary is needed. Jobs the runner does not vouch for still run on Dagger until each native job has cgroup limits (phase 4).'
time: 2026-11-01T12:00:00.000000-04:00
