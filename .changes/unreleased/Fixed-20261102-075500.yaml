kind: Fixed
body: 'The native layer store''s locking is model-checked with TLC (proofs/tla/StoreLocking.tla, run by the new store-model workflow), and the model found two races, both fixed. A Dockerfile build''s layer was published without its key''s lock, so another runner''s collect could take the half-published entry for a dead runner''s and remove it while it was renamed into place, leaving a published layer with a half-deleted tree or no lock file; layers.zig now publishes under the key''s lock, as a step does. And an eviction that opened an entry''s lock file just before another runner evicted that entry would take the lock on the unlinked file and rename away the entry published under the key since, from under the job holding it; evict now checks its lock is on the file the path names, as open and lockKey do.'
