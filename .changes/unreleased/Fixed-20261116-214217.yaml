kind: Fixed
body: 'A job reaches a Gitea or Forgejo that is a Docker container with a port published on the host''s own address (-p 10.0.0.5:3000:3000, with that address as ROOT_URL): the jobs'' forward rule matches the connection''s original destination (ct original ip daddr and proto-dst), not the address Docker''s NAT has already rewritten, so the job''s connections no longer time out. The rule takes the connection''s first direction only and not a packet going back out of the jobs'' bridge, so a packet made up to look like a reply to another job''s connection is no longer forwarded back to the bridge by it; packets with no connection (invalid, untracked) match nothing and are dropped in forward. A job reaches what the published port maps to, by that address and port, and no other published port or container address (root tests on the wire, with a second job making up replies). What it does not change: jobs on the shared bridge can still send packets with another job''s source address in the first direction (#603), and a local REDIRECT or a DNAT to a port of the host itself is matched in input as before, by the address and port as dialled.'
