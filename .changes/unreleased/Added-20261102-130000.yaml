kind: Added
body: 'A nightly "Stress" job in the `analysis` workflow: the runner''s concurrency-sensitive tests (cancels, deadlines and timeouts, the memory gate, the native store''s locks, pg''s connect and the log writer, the broker''s long-poll, log uploads) run 100 times over under stress-ng''s CPU and memory load, with the database, failing on the first round that fails, its output an artifact. `-Dtest-filter=upload` now finds the log upload tests, and pg''s test of a server that never answers no longer fails under Valgrind (its connect to the answering server had 200 ms). rr and Valgrind''s Helgrind and DRD were tried and left out: GitHub''s runner has no performance counters for rr, and Helgrind and DRD cannot see Zig''s futex-based locks.'
