kind: Fixed
body: 'Native jobs in an image without /etc/resolv.conf or /etc/hosts (Alpine''s, and most of Docker Hub''s but Debian''s and Ubuntu''s) now get the job''s resolver and hosts file: a `container:` job, a Docker action, its Dockerfile''s `RUN` and a service in such an image had no DNS, since the binds were made only over a file the image has. A layer of the job''s below every image holds empty files at both paths, so the binds always have a mount point and no layer of the job''s keeps one. A root test now checks that the built-in checkout''s and an action''s fetch resolve through the job''s resolver as root and as the runner user with a Zig seed below (razorbill''s toolcache job), and a Docker action in an image without a resolver of its own; the services test asks for postgres 18, as its image script now provides.'
time: 2026-11-02T02:00:00.000000-04:00
