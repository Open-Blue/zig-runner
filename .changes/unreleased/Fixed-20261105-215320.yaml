kind: Fixed
body: 'A runner that has been up for a while no longer loses GitHub when a certificate rotates. A certificate issued after the runner started failed every new connection until a restart: std reports any failed handshake as `TlsInitializationFailed`, which the check that replaces the client did not match. The client is now replaced after such a failure, at most once in 15 minutes, and once it is a day old, so it also stops accepting a certificate that expired since it started; and `github/http.zig`s tests, which the build never listed, now run.'
time: 2026-11-05T21:53:20.055473402-05:00
