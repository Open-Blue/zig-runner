kind: Security
body: 'The release''s binaries are hardened and gated: both are now static position-independent executables (`-fPIE`, and `runner/build.zig`''s new `pie` option, on by default, so `zig build`, the image and the release still make the same binary), which the kernel loads at a random address instead of the fixed 0x1000000, with full RELRO, beside the non-executable stack and W^X segments they had. checksec 3.2 (slimm609/checksec, pinned by version and checksum, `.github/scripts/checksec.sh`) fails the release, and on pull requests "Release builds" and "Binaries (check)", on any binary without PIE, full RELRO, NX or W^X. A new check, "Release builds and tests (arm64)", builds the release on GitHub''s arm64 runner, runs the aarch64 binary and the tests natively there (rootless and as root), so razorbill is no longer the first machine to execute an aarch64 build. PIE costs 0-3% on the runner''s hot paths on the laptop (`.github/scripts/hotbench.sh`: expressions +2.9%, the hashFiles() glob +2.1%, YAML 4.2% faster) and nothing on the test suite (BENCHMARKS.md). Intel CET is not available: Zig 0.17 has no `-fcf-protection` for Zig code.'
time: 2026-11-01T23:50:00.000000-04:00
