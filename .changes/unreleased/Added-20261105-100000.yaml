kind: Added
body: The tests run in as many processes as the machine has cores, in `zig build test`, CI and the pre-push hook alike (`runner/tools/test_shards.zig`; `ZIG_TEST_SHARDS=1` for one). The tests that use fixed ports on the host, and as root all the native backend's, still run one at a time.
