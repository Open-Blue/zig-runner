kind: Fixed
body: A native container job's fallback to a tag's last known digest, when the registry cannot answer, ends RUNNER_IMAGE_TAG_MAX_STALE seconds (default 86400) after the registry last confirmed the tag, so a deleted or replaced tag is not run for ever; the image_tag_reused warning now has age_s and moved=true new_digest=... when a HEAD saw the tag move, and a HEAD-confirmed tag is said so in Set up job (#551)
time: 2026-11-20T12:49:50.352094947-05:00
