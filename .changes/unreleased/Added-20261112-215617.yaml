kind: Added
body: 'Gitea and Forgejo runners run the tasks they fetch and report them (#520, G4): the task''s job goes through the same steps, memory gate, trust decision and step cache as a GitHub job, and its steps, logs, outputs and result reach the instance as it runs, with the instance''s cancel and the job''s timeout-minutes (default 360) stopping it through the usual cancel ladder. Checkout fetches from the instance with the task''s own token. No run state is written to the database for these platforms.'
