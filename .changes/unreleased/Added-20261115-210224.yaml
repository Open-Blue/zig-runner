kind: Added
body: 'RUNNER_CARGO_TARGET_CACHE=true (with RUNNER_ZIG_LOCAL_CACHE) keeps cargo''s target directory between jobs, in Zig''s local cache volume (cargo-target/), so a Rust library a Zig build compiles, such as zig-runner''s own zr-net, is not compiled again by every job: same scope (repo jobs only; an untrusted job''s is its own), same size limit and generations, on the Dagger and native backends; a job keeps the generation it started in even when another job rolls the cache. Repo-scope jobs that run Zig now get the scope''s cargo registry volume too (untrusted ones do not), and build-zr-net.sh uses it, builds offline (--frozen) first and falls back to the network, so a failing crates.io lookup no longer fails a build whose crates are cached. See docs/OPERATIONS.md, Cargo''s caches.'
