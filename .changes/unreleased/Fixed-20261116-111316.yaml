kind: Fixed
body: 'Gitea and Forgejo jobs fetch an action named owner/repo@ref from the instance''s default actions URL (the task''s gitea_default_actions_url: github.com on Gitea, data.forgejo.org on Forgejo) instead of the instance itself, and read Gitea''s other forms as its model does (#520, G5): self:owner/repo[/path]@ref is the instance, https://host/owner/repo[/path]@ref is that host, and $/path is an action of the workflow''s own repository at the job''s commit, fetched with the task''s token. ssh:// and credentials in a URL are refused with a reason. On GitHub an action''s mount path (github.action_path) is unchanged, but an action whose ref has a character outside letters, digits and -_./+@, or a .. or an empty segment, is now refused with a reason before anything is fetched, as on Gitea.'
