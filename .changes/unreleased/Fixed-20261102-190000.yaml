kind: Fixed
body: 'Native steps no longer wait for every other write to the disk they run on, which cost native jobs seconds on razorbill''s SD card (toolcache 26 s and cache 20 s against Dagger''s 6 s and 8 s), most of all while another job filled its tool cache. Each step''s overlay synced its whole upper filesystem when it was unmounted, at every step''s end: it is now mounted `volatile` (Linux 5.10; older kernels mount it as before). Publishing a layer synced the whole store''s filesystem (`syncfs`, #272): a layer of up to 256 entries now fsyncs only its own files and directories, from 16 threads so the journal commits them together, and a larger one syncs the filesystem as before. A published entry is still never visible before its contents are on disk, and the job syncs the layers'' directory once at its end. On a laptop with another process filling the same disk, a cached job''s syncs went from 42 s to 5.5 s; alone, from 316 ms to 259 ms. A helper now reads its spec in one go, not a byte at a time. Native jobs also say where their time goes: the runner''s log gets one line per native job with every phase of its set-up, of each sandbox, of each layer published and of its teardown, and with step debug "Set up job" and each step show theirs. `.github/scripts/native-phases.sh` turns those lines into per-phase medians; the end-to-end suite prints them after its native pass, and on razorbill `journalctl -u zig-runner@bench.service | .github/scripts/native-phases.sh` does.'
