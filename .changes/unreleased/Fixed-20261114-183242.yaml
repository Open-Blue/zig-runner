kind: Fixed
body: CI's Store crash job fetches the pinned xfstests commit from kernel.org, then kernel.googlesource.com, then GitHub's mirror, giving up on one after 60 s (a dead host, or a transfer stalled for 30 s) and checking the commit's hash, so one unreachable host no longer fails the job.
