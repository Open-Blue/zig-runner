kind: Fixed
body: 'Native jobs now say where their time goes: the runner''s log gets one line per native job with every phase of its set-up (store, cgroup, slot, NAT rules, network helper, image, provisioning, caches, actions, base), of each sandbox (helper start, namespaces, idmapped lowers, overlay, binds, root, the step, exit), of each layer published (id shift, size, record, sync, rename) and of its teardown, and with step debug "Set up job" and each step show theirs. `.github/scripts/native-phases.sh` turns those lines into per-phase medians, and the end-to-end suite prints them after its native pass; on razorbill, `journalctl -u zig-runner@bench.service | .github/scripts/native-phases.sh`.'
