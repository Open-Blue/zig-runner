kind: Fixed
body: 'A native job cancelled while a step waited for its key''s lock (another job running the same step) or for a service to be ready now stops: both waits swallowed the cancel, which std.Io delivers once, and went on until the other job finished or the service''s readiness limit passed. ZLint''s suppressed-errors rule, which ci cannot run until ZLint applies line-level disables, now runs nightly (analysis''s "ZLint (suppressed-errors)") against a baseline of the 119 sites read and meant, matched by file and a fingerprint of the line, and fails on a new one. CI''s Workflows job also runs hadolint on the Dockerfile (whose findings are fixed: one RUN for the certs stage, pipefail for the build stage''s; unversioned apk packages kept, with why) and shfmt on every shell script, both pinned and checked against their checksums, with Renovate following them.'
