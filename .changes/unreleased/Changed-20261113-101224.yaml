kind: Changed
body: 'A job''s layers are canonicalised faster: the step''s ids are shifted with one xattr listing per entry instead of three reads through the descriptor''s magic link, so an upper of 3,000 files takes about 40 ms instead of 72 ms. The same ids, set-id bits, capabilities and ACLs result.'
