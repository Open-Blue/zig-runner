kind: Added
body: 'Line coverage of the runner''s tests with kcov (Ubuntu''s package, pinned), nightly and on every pull request that changes `runner/src`, as `analysis`''s "Coverage" job: the rootless tests, the native backend''s root pass and the runner binary they start for their sandboxes, merged into an HTML report with Cobertura XML and JSON (the `coverage` artifact), and a job summary with the total, each directory and the least-covered security-relevant files. It reports without failing; `COVERAGE_MIN` sets a floor later. Nothing is sent to a coverage service.'
