kind: Added
body: 'Mutation testing of the security-critical modules (secret masking, workflow commands, expressions, the native store, minisign): runner/tools/mutate.py changes a module''s code one thing at a time (a comparison flipped, `and` for `or`, a `return error.X` guard taken away, a constant off by one, a statement deleted), runs that module''s tests on each change, and reports every change they let through by file and line. The `mutation` workflow runs it for one module when asked for, over four of GitHub''s runners, with the report as an artifact; it is too slow for a pull request. New tests kill the most important survivors of the first run: in masking (a lone secret, a one-byte one, a line of exactly four bytes, URL-encoded forms, bytes past ASCII, the stop-commands token), the native store (collect keeping what it should and evicting least recently used first, a changed record, half-built layers, record limits), workflow commands (an escape cut short at the end of the data, which a mutant read past), and `if:` conditions after a failure.'
