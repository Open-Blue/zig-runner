\* Liveness under the fairness of GitHub's and the jobs' steps (not of merges, new runs or the
\* maintainer's approval), and the safety invariants again: a merge, two version runs, a push run
\* reporting no check, a lost run, a failure. TagJobEnds here, DeployEnds in -liveness-deploy.cfg,
\* the same model, so that spin.sh checks the two side by side.
\* spin-states: 373,472
CONSTANTS
    MaxMerges = 1
    MaxRuns = 2
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "others"
    OtherWf = TRUE
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneTagJob TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded FastFail
PROPERTIES TagJobEnds
