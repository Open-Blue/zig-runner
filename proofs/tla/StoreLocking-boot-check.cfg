\* What the check after a boot is for. Without the publish's sync, a crash leaves entries that
\* validate over a tree the disk lost: no job may take one, as the first job of the boot evicts it
\* and the others wait for it. The mutant below is this with the check taken away.
\* states without symmetry: 382,279 (TLC; SPIN checks this configuration, proofs/spin)
CONSTANTS
    p1 = p1  p2 = p2
    k1 = k1
    Procs = {p1, p2}
    StepKeys = {k1}
    BuildKeys = {}
    Steps = 1
    MaxCrashes = 0
    MachineCrashes = 1
    MaxCorrupts = 0
    MaxWriteErrors = 0
    OldEntry = FALSE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = FALSE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK NoBadRead HeldIntact KeyMutex
