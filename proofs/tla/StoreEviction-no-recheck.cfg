    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
    MaxPlants = 0
    MaxStuck = 0
    SyncsFilesystem = TRUE
    ClearsPlanted = TRUE
    StuckStopsNothing = TRUE
SPECIFICATION Spec
