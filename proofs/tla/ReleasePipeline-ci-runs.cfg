\* #408 with its fast fail counting only the runs of the workflows that report the checks
\* (ci.yml's and proofs.yml's), not every run on the commit: the change the finding
\* ReleasePipeline-own-run.cfg shows would need. Then FastFail holds too.
CONSTANTS
    MaxMerges = 1
    MaxRuns = 3
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "ci"
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneTagJob TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded FastFailAllRuns FastFail
