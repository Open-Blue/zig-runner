\* A mutant SPIN must fail: NamedWhole. An eviction that deletes before its rename is on disk, on a
\* filesystem that keeps the deletes and loses the rename: the name comes back on a tree half gone.
CONSTANTS
    NoKey = NoKey
    p1 = p1  v1 = v1
    Procs = {p1}
    Volumes = {v1}
    Trees = {}
    Outer = NoKey
    Inner = NoKey
    Rounds = 2
    MaxCrashes = 0
    MachineCrashes = 1
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = FALSE
    MaxPlants = 0
    MaxStuck = 0
    SyncsFilesystem = TRUE
    ClearsPlanted = TRUE
    StuckStopsNothing = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NamedWhole
