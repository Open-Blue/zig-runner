\* ReleasePipeline-liveness.cfg with its other property, DeployEnds (see there), and the safety
\* invariants again.
\* tlc-seconds: 70 (GitHub's runner, 2026-11-08; tlc.sh balances its parts by it)
CONSTANTS
    MaxMerges = 1
    MaxRuns = 2
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "others"
    OtherWf = TRUE
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneTagJob TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded FastFail
PROPERTIES DeployEnds
