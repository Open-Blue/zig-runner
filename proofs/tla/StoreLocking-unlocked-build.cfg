\* A mutant SPIN must fail: NoWrongValid. layers.zig's publish as it was before the fix, without the
\* key's lock: another runner's collect, finding the lock free, removes the build's .tmp- entry while
\* it is renamed into place, so an entry validates whose tree is half deleted.
CONSTANTS
    p1 = p1  p2 = p2
    b1 = b1
    Procs = {p1, p2}
    StepKeys = {}
    BuildKeys = {b1}
    Steps = 1
    MaxCrashes = 0
    MachineCrashes = 0
    MaxCorrupts = 0
    MaxWriteErrors = 0
    OldEntry = FALSE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    BuildHoldsKeyLock = FALSE
    SyncBeforePublish = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
