\* Safety across a machine's crash: two runners, a volume and a tree, a job each, a process crash,
\* the crash, and a job each after it.
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  t1 = t1  v1 = v1
    Procs = {p1, p2}
    Volumes = {v1}
    Trees = {t1}
    Outer = NoKey
    Inner = NoKey
    Rounds = 1
    MaxCrashes = 1
    MachineCrashes = 1
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
    MaxPlants = 0
    MaxStuck = 1
    SyncsFilesystem = TRUE
    ClearsPlanted = TRUE
    StuckStopsNothing = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK HeldWhole NamedWhole OneMaker LocksExclude NotPinned PassGoesOn
