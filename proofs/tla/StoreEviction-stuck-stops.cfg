\* A mutant TLC must fail: PassGoesOn. A pass that ends at a dead tree it cannot remove: a job that can
\* make one stops eviction in every area.
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  p3 = p3  t1 = t1  v1 = v1
    Procs = {p1, p2, p3}
    Volumes = {v1}
    Trees = {t1}
    Outer = NoKey
    Inner = NoKey
    Rounds = 1
    MaxCrashes = 1
    MachineCrashes = 0
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
    MaxPlants = 0
    MaxStuck = 1
    SyncsFilesystem = TRUE
    ClearsPlanted = TRUE
    StuckStopsNothing = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK PassGoesOn
