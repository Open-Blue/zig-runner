\* Liveness under weak fairness of each runner, and the safety invariants again, without symmetry
\* (a symmetry reduction is unsound for liveness): two runners, a step key and a build key,
\* one step a job, a process crash and a hand's change. The machine's crash ends every process, so
\* it adds nothing here.
\* spin-states: 167,363
CONSTANTS
    p1 = p1  p2 = p2
    k1 = k1  b1 = b1
    Procs = {p1, p2}
    StepKeys = {k1}
    BuildKeys = {b1}
    Steps = 1
    MaxCrashes = 1
    MachineCrashes = 0
    MaxCorrupts = 1
    MaxWriteErrors = 0
    OldEntry = FALSE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoBadRead HeldIntact KeyMutex NoWrongValid NoLostUpper OnePub NoBuildLost
    NoLostPublish OldGoes
PROPERTIES WaitEnds AllEnd
