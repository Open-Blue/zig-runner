\* A mutant TLC must fail: HeldWhole. An eviction that goes by the last use alone, without the entry's
\* lock: it takes a volume a job is using.
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  v1 = v1
    Procs = {p1, p2}
    Volumes = {v1}
    Trees = {}
    Outer = NoKey
    Inner = NoKey
    Rounds = 1
    MaxCrashes = 0
    MachineCrashes = 0
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = FALSE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK HeldWhole
