\* The weaker reading of GitHub's concurrency docs: a run whose tag job waits for approval is not in
\* progress in the group, so a newer run starts beside it. Two tag jobs may then run at once
\* (OneTagJob fails, left out here), and everything else still holds: the atomic push, not the
\* group, keeps a tag on main and checked.
\* spin-states: 1,445,111
CONSTANTS
    MaxMerges = 1
    MaxRuns = 2
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "others"
    OtherWf = TRUE
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = FALSE
SPECIFICATION Spec
VIEW LiveView
INVARIANTS TypeOK TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded FastFail
