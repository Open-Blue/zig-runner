\* A mutant TLC must fail: NoWrongValid. A lookup that ignores the boot a pending mark names (and that
\* any job may take a pending layer): after a crash it takes a layer whose data never reached the disk.
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 1
    MachineCrashes = 1
    MaxRunnerCrashes = 0
    MaxWriteErrors = 0
    SyncBeforeMark = TRUE
    CheckBoot = FALSE
    SettleAtEnd = TRUE
    OwnerOnly = FALSE
    PoisonOnFail = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
