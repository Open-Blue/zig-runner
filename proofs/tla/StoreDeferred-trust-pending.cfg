\* A mutant TLC must fail: NoWrongValid. A lookup that ignores the boot a pending mark names: after a
\* crash it takes a layer whose data never reached the disk.
CONSTANTS
    p1 = p1  p2 = p2
    Procs = {p1, p2}
    Steps = 1
    MachineCrashes = 1
    MaxWriteErrors = 0
    SyncBeforeMark = TRUE
    CheckBoot = FALSE
    SettleAtEnd = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
