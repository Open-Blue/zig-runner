\* The deferred sync with each job's end syncing on its own (RUNNER_NATIVE_SETTLE_WINDOW_MS=0, as
\* before the shared settle), in StoreDeferred.cfg's bounds: the same guarantees.
\* spin-states: 36,662
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 2
    MachineCrashes = 1
    MaxRunnerCrashes = 1
    MaxWriteErrors = 1
    SyncBeforeMark = TRUE
    CheckBoot = TRUE
    SettleAtEnd = TRUE
    BatchAtEnd = FALSE
    BatchSyncFirst = TRUE
    OwnerOnly = TRUE
    PoisonOnFail = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid NoLostPublish MarkedHasData
