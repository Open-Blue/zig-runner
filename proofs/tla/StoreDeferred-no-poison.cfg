\* A mutant TLC must fail: NoWrongValid. A pending layer any job of the boot may take and a failed settle
\* that does not refuse it (the first version): a reader holds a layer whose write-back was lost.
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 1
    MachineCrashes = 1
    MaxRunnerCrashes = 0
    MaxWriteErrors = 1
    SyncBeforeMark = TRUE
    CheckBoot = TRUE
    SettleAtEnd = TRUE
    OwnerOnly = FALSE
    PoisonOnFail = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
