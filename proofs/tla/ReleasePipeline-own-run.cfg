\* A finding TLC must fail: FastFail. #408 as it is: wait-for-checks.sh counts every workflow run
\* on the commit, the waiting job's own among them, so the fast fail never fires in the deploy job
\* (release.yml's run is on the tag commit) nor in a tag job on the commit its version run was made
\* at; a check that never started holds the wait to its end. Not fixed here (ReleasePipeline-ci-runs.cfg).
CONSTANTS
    MaxMerges = 1
    MaxRuns = 3
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "all"
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
INVARIANTS FastFail
