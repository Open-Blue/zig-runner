\* A mutant SPIN must fail: NoWrongValid. publishTimed going on after a sync failed, as one that never
\* looked at fsync's result would: the rename publishes an entry the disk does not have, which a
\* crash then leaves validating (the store's crash test shows the same on dm-flakey).
CONSTANTS
    p1 = p1
    k1 = k1
    Procs = {p1}
    StepKeys = {k1}
    BuildKeys = {}
    Steps = 1
    MaxCrashes = 0
    MachineCrashes = 1
    MaxCorrupts = 0
    MaxWriteErrors = 1
    OldEntry = FALSE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = TRUE
    HeedSyncErrors = FALSE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
