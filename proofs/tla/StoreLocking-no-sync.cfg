\* A mutant SPIN must fail: NoWrongValid. Store.publish without its syncfs (Store.zig:462): a machine
\* crash after the rename leaves an entry that validates but whose tree was never written to disk.
CONSTANTS
    p1 = p1
    k1 = k1
    Procs = {p1}
    StepKeys = {k1}
    BuildKeys = {}
    Steps = 1
    MaxCrashes = 0
    MachineCrashes = 1
    MaxCorrupts = 0
    MaxWriteErrors = 0
    OldEntry = FALSE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = FALSE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
