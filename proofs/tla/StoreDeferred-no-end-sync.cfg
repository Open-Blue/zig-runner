\* A mutant SPIN must fail: NoLostPublish. A job's end that leaves its last layer pending: a layer a
\* finished job published is refused after a crash.
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 1
    MachineCrashes = 1
    MaxRunnerCrashes = 0
    MaxWriteErrors = 0
    SyncBeforeMark = TRUE
    CheckBoot = TRUE
    SettleAtEnd = FALSE
    OwnerOnly = TRUE
    PoisonOnFail = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostPublish
