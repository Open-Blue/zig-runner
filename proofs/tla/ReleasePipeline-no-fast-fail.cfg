\* A mutant SPIN must fail: FastFail. wait-for-checks.sh as it was before #408: a check that never
\* started holds the wait to its end, after every run on the commit has finished.
CONSTANTS
    MaxMerges = 1
    MaxRuns = 3
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = FALSE
    RunsCounted = "others"
    OtherWf = TRUE
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
VIEW LiveView
INVARIANTS FastFail TypeOK OneTagJob TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded
