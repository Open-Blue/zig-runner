\* A mutant TLC must fail: NamedWhole. An eviction that deletes before it renames: a crash between
\* leaves the name on a tree half gone.
CONSTANTS
    NoKey = NoKey
    p1 = p1  v1 = v1
    Procs = {p1}
    Volumes = {v1}
    Trees = {}
    Outer = NoKey
    Inner = NoKey
    Rounds = 2
    MaxCrashes = 1
    MachineCrashes = 0
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = FALSE
    SyncsRename = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NamedWhole
