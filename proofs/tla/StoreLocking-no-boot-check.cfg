\* A mutant TLC must fail: NoBadRead. StoreLocking-boot-check.cfg without `checkOncePerBoot`: a job
\* after the crash takes an entry whose tree the disk lost.
CONSTANTS
    p1 = p1  p2 = p2
    k1 = k1
    Procs = {p1, p2}
    StepKeys = {k1}
    BuildKeys = {}
    Steps = 1
    MaxCrashes = 0
    MachineCrashes = 1
    MaxCorrupts = 0
    MaxWriteErrors = 0
    OldEntry = FALSE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = FALSE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = FALSE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoBadRead
