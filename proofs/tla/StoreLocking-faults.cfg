\* Safety with a process's faults at once: two steps a job, a process crash, a hand's change, a sync
\* the disk fails and an entry an older store_format left.
\* spin-states: 10,758,379
CONSTANTS
    p1 = p1  p2 = p2
    k1 = k1  b1 = b1
    Procs = {p1, p2}
    StepKeys = {k1}
    BuildKeys = {b1}
    Steps = 2
    MaxCrashes = 1
    MachineCrashes = 0
    MaxCorrupts = 1
    MaxWriteErrors = 1
    OldEntry = TRUE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = TRUE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK NoBadRead HeldIntact KeyMutex NoWrongValid NoLostUpper OnePub NoBuildLost
    NoLostPublish OldGoes
