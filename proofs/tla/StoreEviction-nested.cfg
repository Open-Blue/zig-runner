\* Safety with a volume inside another's directory: three runners, a process crash.
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  p3 = p3  v1 = v1  v2 = v2
    Procs = {p1, p2, p3}
    Volumes = {v1, v2}
    Trees = {}
    Outer = v1
    Inner = v2
    Rounds = 1
    MaxCrashes = 1
    MachineCrashes = 0
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
    MaxPlants = 1
    MaxStuck = 0
    SyncsFilesystem = TRUE
    ClearsPlanted = TRUE
    StuckStopsNothing = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK HeldWhole NamedWhole OneMaker LocksExclude NotPinned PassGoesOn
