\* A mutant SPIN must fail: NoWrongValid. The durable mark written before the data's fsyncs: a crash
\* between them leaves a layer marked durable whose tree never reached the disk.
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 1
    MachineCrashes = 1
    MaxRunnerCrashes = 0
    MaxWriteErrors = 0
    SyncBeforeMark = FALSE
    CheckBoot = TRUE
    SettleAtEnd = TRUE
    BatchAtEnd = FALSE
    BatchSyncFirst = TRUE
    OwnerOnly = TRUE
    PoisonOnFail = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
