\* The deferred sync (a publish renamed in pending, made durable at the next publish or the job's end):
\* two runners, two layers a job, a machine crash and a failed sync. No lookup after any crash takes a
\* layer whose tree is not whole, and a job whose end finished loses none of its layers.
CONSTANTS
    p1 = p1  p2 = p2
    Procs = {p1, p2}
    Steps = 2
    MachineCrashes = 1
    MaxWriteErrors = 1
    SyncBeforeMark = TRUE
    CheckBoot = TRUE
    SettleAtEnd = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid NoLostPublish MarkedHasData
