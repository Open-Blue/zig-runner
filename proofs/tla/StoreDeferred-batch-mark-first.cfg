\* A mutant SPIN must fail: NoWrongValid. A job's end that joins a shared settle and marks its layer
\* durable before the batch's syncfs has run: a crash between them leaves a layer marked durable whose
\* tree never reached the disk.
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 1
    MachineCrashes = 1
    MaxRunnerCrashes = 0
    MaxWriteErrors = 0
    SyncBeforeMark = TRUE
    CheckBoot = TRUE
    SettleAtEnd = TRUE
    BatchAtEnd = TRUE
    BatchSyncFirst = FALSE
    OwnerOnly = TRUE
    PoisonOnFail = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
