\* A mutant SPIN must fail: NoWrongValid. A failed settle refuses its layer, but any job of the boot may
\* take a pending one: a reader takes it before its writer's settle finds the loss (or after its runner was killed).
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 1
    MachineCrashes = 1
    MaxRunnerCrashes = 1
    MaxWriteErrors = 0
    SyncBeforeMark = TRUE
    CheckBoot = TRUE
    SettleAtEnd = TRUE
    BatchAtEnd = FALSE
    BatchSyncFirst = TRUE
    OwnerOnly = FALSE
    PoisonOnFail = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid
