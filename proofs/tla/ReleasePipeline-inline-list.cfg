\* A mutant SPIN must fail: FreshList. The names inline in version.yml, before #408: the run's own
\* file, from main when the run was made, while the tag job waits on main as it is after approval;
\* a rename merged between the two is waited for under its old name.
CONSTANTS
    MaxMerges = 1
    MaxRuns = 3
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = FALSE
    FastFails = TRUE
    RunsCounted = "others"
    OtherWf = TRUE
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
VIEW LiveView
INVARIANTS FreshList TypeOK OneTagJob TagOnMain TagChecked DeployChecked Includes WaitBounded FastFail
