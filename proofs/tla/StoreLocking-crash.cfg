\* Safety with every kind of failure at once: two runners, a step key and a build key, two steps a
\* job, a process crash, a machine crash and a hand's change to an entry.
CONSTANTS
    p1 = p1  p2 = p2
    k1 = k1  b1 = b1
    Procs = {p1, p2}
    StepKeys = {k1}
    BuildKeys = {b1}
    Steps = 2
    MaxCrashes = 1
    MachineCrashes = 1
    MaxCorrupts = 1
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = TRUE
    EvictRechecks = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK NoBadRead HeldIntact KeyMutex NoWrongValid NoLostUpper OnePub
