\* Safety across a machine's crash: two runners and a step key, a process crash and a hand's change,
\* then the crash and the first jobs of the next boot (`checkOncePerBoot`). Two steps a job, write
\* errors and an older format's entry are StoreLocking-faults.cfg's; a build key adds nothing a crash
\* can see, as a build's publish is a step's.
\* spin-states: 14,674,009
CONSTANTS
    p1 = p1  p2 = p2
    k1 = k1
    Procs = {p1, p2}
    StepKeys = {k1}
    BuildKeys = {}
    Steps = 1
    MaxCrashes = 1
    MachineCrashes = 1
    MaxCorrupts = 1
    MaxWriteErrors = 0
    OldEntry = FALSE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = TRUE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK NoBadRead HeldIntact KeyMutex NoWrongValid NoLostUpper OnePub NoBuildLost
    NoLostPublish OldGoes
