\* A mutant SPIN must fail: HeldWhole. An eviction that takes a volume's lock and not the lock of the
\* volume inside it: the job holding the inner one loses it.
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  v1 = v1  v2 = v2
    Procs = {p1, p2}
    Volumes = {v1, v2}
    Trees = {}
    Outer = v1
    Inner = v2
    Rounds = 1
    MaxCrashes = 0
    MachineCrashes = 0
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = FALSE
    RenameFirst = TRUE
    SyncsRename = TRUE
    MaxPlants = 0
    MaxStuck = 0
    SyncsFilesystem = TRUE
    ClearsPlanted = TRUE
    StuckStopsNothing = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK HeldWhole
