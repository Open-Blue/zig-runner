\* Safety of the pipeline as #408 has it (proofs/README.md, "The release pipeline, in TLA+"): a
\* merge, which may rename or add a check, three version runs (one in progress, one pending, a third
\* replacing it), a push run GitHub never creates, a push run or a release's job that fails, a wait
\* of two polls with a grace of one. Two merges are -merges.cfg's, liveness -liveness.cfg's.
CONSTANTS
    MaxMerges = 1
    MaxRuns = 3
    MaxRenames = 1
    MaxLost = 1
    MaxFails = 1
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "all"
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneTagJob TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded FastFailAllRuns
