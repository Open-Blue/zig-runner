\* The deferred sync with the ownership rule alone: a failed settle does not poison its layer, and no job but its writer takes a pending one, so it holds (the poison is for the layers a job already holds, which the model does not tell apart). Same bounds as StoreDeferred.cfg.
\* states without symmetry: 34,601 (TLC, which has no symmetry here; SPIN checks this configuration, proofs/spin)
CONSTANTS
    p1 = p1  p2 = p2  r1 = r1
    Procs = {p1, p2}
    Readers = {r1}
    Steps = 2
    MachineCrashes = 1
    MaxRunnerCrashes = 1
    MaxWriteErrors = 1
    SyncBeforeMark = TRUE
    CheckBoot = TRUE
    SettleAtEnd = TRUE
    OwnerOnly = TRUE
    PoisonOnFail = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongValid NoLostPublish MarkedHasData
