\* Safety with two merges (a rename before the tag job reads main and one while it waits, or the
\* other way round) and two version runs, no lost run and no failure: those are ReleasePipeline.cfg's.
CONSTANTS
    MaxMerges = 2
    MaxRuns = 2
    MaxRenames = 1
    MaxLost = 0
    MaxFails = 0
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "all"
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneTagJob TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded FastFailAllRuns
