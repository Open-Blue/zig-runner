\* Safety with two merges (a rename before the tag job reads main and one while it waits, or the
\* other way round) and two version runs; no lost run, no failure and no third push run, which are
\* ReleasePipeline.cfg's (without a lost run no check is missing, so FastFail holds trivially here).
\* spin-states: 1,474,774
CONSTANTS
    MaxMerges = 2
    MaxRuns = 2
    MaxRenames = 1
    MaxLost = 0
    MaxFails = 0
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "others"
    OtherWf = FALSE
    DeployIfExplicit = TRUE
    AtomicPush = TRUE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
VIEW LiveView
INVARIANTS TypeOK OneTagJob TagOnMain TagChecked DeployChecked FreshList Includes WaitBounded FastFail
