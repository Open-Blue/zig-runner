\* A mutant SPIN must fail: NamedWhole. removeDead syncing only the area's directory: a volume's rename has
\* another source directory, so a crash can keep the name and the deletes. Found in review, in 25 states.
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  t1 = t1  v1 = v1
    Procs = {p1, p2}
    Volumes = {v1}
    Trees = {t1}
    Outer = NoKey
    Inner = NoKey
    Rounds = 1
    MaxCrashes = 1
    MachineCrashes = 1
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
    MaxPlants = 0
    MaxStuck = 0
    SyncsFilesystem = FALSE
    ClearsPlanted = TRUE
    StuckStopsNothing = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NamedWhole
