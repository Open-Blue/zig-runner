\* Safety as the code has it: three runners, a volume and a tree, one job each and a collect, a process
\* crash. A machine's crash is StoreEviction-crash.cfg's, the entry inside another -nested's.
\* tlc-seconds: 6 (GitHub's runner, 2026-11-08; tlc.sh balances its parts by it)
\* states without symmetry: 3,109,886 (TLC; SPIN checks this configuration, proofs/spin)
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  p3 = p3  t1 = t1  v1 = v1
    Procs = {p1, p2, p3}
    Volumes = {v1}
    Trees = {t1}
    Outer = NoKey
    Inner = NoKey
    Rounds = 1
    MaxCrashes = 1
    MachineCrashes = 0
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
    MaxPlants = 0
    MaxStuck = 1
    SyncsFilesystem = TRUE
    ClearsPlanted = TRUE
    StuckStopsNothing = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK HeldWhole NamedWhole OneMaker LocksExclude NotPinned PassGoesOn
