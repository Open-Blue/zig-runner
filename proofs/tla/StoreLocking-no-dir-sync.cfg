\* A mutant SPIN must fail: NoLostPublish. A job's end without `syncLayers`: a crash loses the rename
\* of a layer whose job had finished.
CONSTANTS
    p1 = p1
    k1 = k1
    Procs = {p1}
    StepKeys = {k1}
    BuildKeys = {}
    Steps = 1
    MaxCrashes = 0
    MachineCrashes = 1
    MaxCorrupts = 0
    MaxWriteErrors = 0
    OldEntry = FALSE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = TRUE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = FALSE
    CheckAfterBoot = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostPublish
