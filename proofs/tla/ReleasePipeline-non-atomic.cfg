\* A mutant TLC must fail: TagOnMain. The push without --atomic: when main moved since the
\* checkout, main's update is refused and the tag still goes, on a commit off main. Two merges, as
\* -merges.cfg: one before the run has anything to release, one while its tag job waits.
CONSTANTS
    MaxMerges = 2
    MaxRuns = 2
    MaxRenames = 1
    MaxLost = 0
    MaxFails = 0
    WaitTicks = 2
    Grace = 1
    ListFromCommit = TRUE
    FastFails = TRUE
    RunsCounted = "others"
    OtherWf = FALSE
    DeployIfExplicit = TRUE
    AtomicPush = FALSE
    ApprovalHoldsGroup = TRUE
SPECIFICATION Spec
VIEW LiveView
INVARIANTS TagOnMain TypeOK OneTagJob TagChecked DeployChecked FreshList Includes WaitBounded FastFail
