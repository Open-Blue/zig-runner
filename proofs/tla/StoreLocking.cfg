\* Safety of the protocol as the code has it (proofs/README.md, "The store's locking, in TLA+"):
\* three runners, a step key and a build key, one step a job, a process crash. Two-step jobs, the
\* machine's crash and a hand's change are StoreLocking-crash.cfg's; liveness is
\* StoreLocking-liveness.cfg's.
\* states without symmetry: 16,495,442 (TLC; SPIN checks this configuration, proofs/spin)
CONSTANTS
    p1 = p1  p2 = p2  p3 = p3
    k1 = k1  b1 = b1
    Procs = {p1, p2, p3}
    StepKeys = {k1}
    BuildKeys = {b1}
    Steps = 1
    MaxCrashes = 1
    MachineCrashes = 0
    MaxCorrupts = 0
    MaxWriteErrors = 0
    OldEntry = FALSE
    HeedSyncErrors = TRUE
    SyncLayersAtEnd = TRUE
    CheckAfterBoot = TRUE
    BuildHoldsKeyLock = TRUE
    SyncBeforePublish = TRUE
    EvictRechecks = TRUE
    BuildLooksUpFirst = TRUE
    EvictUnlocks = TRUE
SPECIFICATION Spec
SYMMETRY ProcSymmetry
INVARIANTS TypeOK NoBadRead HeldIntact KeyMutex NoWrongValid NoLostUpper OnePub NoBuildLost
    NoLostPublish OldGoes
