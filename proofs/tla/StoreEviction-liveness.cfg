\* Every job ends, without symmetry (unsound for liveness): two runners, a volume and a tree.
CONSTANTS
    NoKey = NoKey
    p1 = p1  p2 = p2  t1 = t1  v1 = v1
    Procs = {p1, p2}
    Volumes = {v1}
    Trees = {t1}
    Outer = NoKey
    Inner = NoKey
    Rounds = 1
    MaxCrashes = 1
    MachineCrashes = 0
    OpenRechecks = TRUE
    DowngradeRechecks = TRUE
    EvictLocks = TRUE
    EvictRechecks = TRUE
    TakesInnerLock = TRUE
    RenameFirst = TRUE
    SyncsRename = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK
PROPERTIES AllEnd
