# The runner without the Dagger engine: layer it over compose.yaml for a pool on the native backend
# (docs/native-backend.md, "Running with no engine").
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.engineless.yaml up -d --build
#
# Jobs the native backend cannot run fail at once, saying why, instead of waiting for an engine,
# and a machine that cannot run native steps at all stops the runner at start-up with the reason.
#
# What the native backend needs of its container (docs/native-backend.md, P1, "Under
# deploy/compose.yaml") is below: privileges for its sandboxes, the host's network for its bridge,
# a store on a volume (overlayfs cannot take an upper directory on overlayfs), the host's
# /run/zig-runner for the slots' locks, and a private cgroup that it moves itself into. A host
# that wants less than `privileged` can use the `cap_add` and `security_opt` lines there instead.
services:
  engine:
    # Not started: only a service in a profile that is not enabled is left out of `up`.
    profiles: ["engine"]
  runner:
    # compose.yaml makes the runner wait for the engine; `!reset` drops the list.
    depends_on: !reset []
    environment:
      RUNNER_BACKEND: native
      RUNNER_ENGINE: none
      # The engine socket's volume is not there to mount.
      RUNNER_ENGINE_HOST: ""
      # The container's own cgroup is its root: the runner makes the jobs' leaves under it.
      RUNNER_NATIVE_CGROUP: self
      RUNNER_NATIVE_STORE: /var/lib/zig-runner/native
    privileged: true
    network_mode: host
    cgroup: private
    # `!override` replaces compose.yaml's list (the engine socket's volume) instead of adding to it.
    volumes: !override
      - native-store:/var/lib/zig-runner/native
      - /run/zig-runner:/run/zig-runner

volumes:
  # Images, layers and cache volumes of the native jobs: the engine's cache, without the engine.
  native-store:
