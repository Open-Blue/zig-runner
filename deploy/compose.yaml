# A pool of runners and the Dagger engine their jobs run in, on one machine (the deployment guide,
# https://github.com/Lementknight/zig-actions-runner/blob/7641a69/docs/DEPLOY.md).
#
#   cp deploy/runner.env.example deploy/runner.env   # then fill it in
#   docker compose -f deploy/compose.yaml up -d
#
# The runner reaches the engine through a unix socket on a shared volume: no Docker socket is
# mounted into the runner and no network listener is opened.
name: zig-runner

services:
  engine:
    image: registry.dagger.io/engine:v0.21.10
    # The engine runs each step in its own container, which needs privileges.
    privileged: true
    command: ["--addr", "unix:///run/dagger/engine.sock"]
    environment:
      # The engine is a Go program: collecting garbage a quarter as often costs about 200 MB more
      # memory and saves 6-13% of its CPU per job (measured; the deployment guide's "Sizing").
      GOGC: "400"
    volumes:
      - engine-state:/var/lib/dagger
      - engine-socket:/run/dagger
      # Caps the engine's cache on disk (the deployment guide's "Sizing"): Dagger's default lets it
      # grow to about three quarters of the disk.
      - ./engine.json:/etc/dagger/engine.json:ro
    restart: unless-stopped
    # No memory limit here: the engine may use all of the machine's memory, and its swap. To cap
    # it, give it a swap limit equal to its memory limit, so it has no swap of its own (with
    # `mem_limit` alone Docker lets it swap as much again, which is how razorbill's 4 GB engine
    # filled the Pi's 2 GB of swap and slowed every service on it for hours, #126):
    #   mem_limit: 4g
    #   memswap_limit: 4g
    # A job that needs more then fails inside the engine, the kernel killing a process in its
    # cgroup, instead of finishing hours later on a machine that is unusable meanwhile. Check what
    # gets killed before relying on it: if it is the engine itself, its unclean restart wipes its
    # cache (below). Not the default because it trades a slow job for a failed one; the runner's
    # memory gate (RUNNER_MIN_MEM_AVAILABLE_MB, runner.env.example) keeps jobs from piling up.
    #
    # Docker kills a container 10 s after asking it to stop. The engine needs longer (22 s on a
    # Raspberry Pi), and one killed before it marks its cache clean wipes the whole cache when it
    # next starts: 21 GB on razorbill, so a 56 s job took 249 s after a reboot. Under 90 s, after
    # which systemd kills Docker itself during a shutdown.
    stop_grace_period: 80s
    # The runner speaks one engine version's protocol: keep image updaters away (WUD would move it
    # to the next Dagger release, and replacing the engine empties its cache).
    labels:
      wud.watch: "false"
      com.centurylinklabs.watchtower.enable: "false"

  runner:
    # The release's image (runner/Dockerfile's `prebuilt` stage); pin a tag in ZIG_RUNNER_IMAGE to stay on one version.
    image: ${ZIG_RUNNER_IMAGE:-ghcr.io/open-blue/zig-runner:latest@sha256:de4ff449caab91e53390289268062b522759656b42e7c18aa8a074a8723623d2}
    env_file: runner.env
    environment:
      RUNNER_ENGINE_HOST: unix:///run/dagger/engine.sock
    # In its own PID namespace the runner cannot see the engine's process, so its memory gate holds
    # on the machine's memory only, not on a cap given to the engine (it logs "the engine's cgroup
    # was not found (EngineProcessNotVisible)"). A runner on the host sees both (#142).
    volumes:
      - engine-socket:/run/dagger
    depends_on:
      - engine
    restart: unless-stopped
    # On `docker compose stop` / `down`, waiting runners stop at once and running jobs get
    # RUNNER_STOP_GRACE_SECS (10 minutes by default) to finish, then are cancelled and reported, as
    # GitHub cancels a job. 15 minutes leaves room for that; past it Docker kills the runner, and
    # GitHub fails its jobs ("lost communication") once their hold runs out. Raise both together.
    stop_grace_period: 15m

volumes:
  # The engine's cache: images, layers, and the step and package caches that make reruns fast.
  engine-state:
  engine-socket:
