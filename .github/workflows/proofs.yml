name: proofs

# The Lean proofs in proofs/ (proofs/README.md): `lake build --wfail` checks every theorem (a `sorry`
# or any other warning fails it), leanchecker replays them in the kernel, Axioms.lean fails on an
# axiom outside its allow list; and the hashFiles model is compared with runner/src/glob.zig on
# random cases (glob-lean-diff.sh), so the proof about the walk holds of the walk that ships; runner/src/native/testdata/step_keys.tsv, which the Zig
# tests check the native store's key against, is checked to be the model's (key-vectors.sh). On
# every pull request, merge group and push to main, and weekly on fresh cases. The seed is the run
# number, and is printed: a failure reproduces locally with the same seed. A required check: on a
# pull request or merge group that changes neither side the job skips its steps and still reports
# (ci-scope.sh proofs), which a path filter would not.

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's runs; without this the required check never reports there.
  merge_group:
  schedule:
    - cron: "41 5 * * 1" # Mondays, 05:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: proofs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proofs:
    name: Proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the proofs
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh proofs

      - name: Install Lean
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-lean.sh

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # --wfail: a warning fails the build, and a `sorry` is a warning.
      - name: Check the proofs
        if: steps.scope.outputs.run == 'true'
        working-directory: proofs
        run: lake build --wfail

      # The kernel replays every declaration from the .olean files, so what the build wrote is what
      # the kernel accepts (no environment hacking by a tactic or an elaborator).
      - name: Replay the proofs in the kernel
        if: steps.scope.outputs.run == 'true'
        working-directory: proofs
        run: lake env leanchecker Runner Glob Oracle KeyOracle

      # Every declaration in Runner and Glob depends on no axiom outside Axioms.lean's allow list,
      # and the main theorems' axioms are printed.
      - name: The axioms the proofs rely on
        if: steps.scope.outputs.run == 'true'
        working-directory: proofs
        run: lake env lean -DwarningAsError=true Axioms.lean

      - name: The native key's vectors are the model's
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/key-vectors.sh

      - name: The hashFiles model against glob.zig
        if: steps.scope.outputs.run == 'true'
        env:
          SEED: ${{ github.run_number }}
        run: |
          echo "seed $SEED: reproduce with .github/scripts/glob-lean-diff.sh 20000 $SEED"
          .github/scripts/glob-lean-diff.sh 20000 "$SEED"
