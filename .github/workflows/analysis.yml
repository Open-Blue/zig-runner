name: analysis

# Zig-specific analysis of the runner's own code, nightly (README, "Pipeline"). CodeQL and Semgrep
# read no Zig, so these search where the tests and ci's ThreadSanitizer pass do not look:
#
#   Fuzz (TARGET)  runner/src/fuzz.zig's targets, each with Zig's coverage-guided fuzzer for a
#                  bounded number of runs (.github/scripts/zig-fuzz.sh): the parsers that read what
#                  registries, workflows, jobs and servers hand the runner. The corpus each finds
#                  is kept from night to night in the Actions cache; a crash, a failed check, a
#                  leak or a hang fails the job, named after its target, with the input as an
#                  artifact (fuzz-TARGET).
#   Valgrind       every test under Valgrind's memcheck (.github/scripts/zig-valgrind.sh): reads
#                  of memory never written, and accesses outside what was allocated.
#   Stress         the concurrency-sensitive tests (.github/scripts/zig-race-tests.sh: cancels,
#                  deadlines, the memory gate, the native store's locks, the database, the
#                  broker's long-poll, log uploads) 100 times over under CPU and memory load
#                  (.github/scripts/zig-stress.sh), with the database; the first failing round
#                  fails the job, its output an artifact (stress-output).
#
# Not here, as they cannot work on these tests (measured 2026-11-02): rr, which needs the CPU's
# performance counters, and GitHub's runner (an Azure VM) exposes none (no `cpu` event source,
# even with perf_event_paranoid at 1: "Unable to open performance counter"); and Valgrind's
# Helgrind and DRD, which know only pthreads' locks and their own annotations, and Zig's std
# builds every lock on raw futexes and atomics (Io.Threaded's own run queue is the first of
# 109,234 Helgrind and 105,938 DRD reports from pg.zig's one deadline test). ci's
# ThreadSanitizer pass sees those locks.
#
# Each search costs more than a pull request should wait for, so they run here and not in ci; a
# failure is a case for an issue (or a fix), not a broken main.

on:
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per fuzz target (each target's own when empty; `100K`, `2M`)
        required: false
  # A pull request that changes this workflow or its scripts runs it, so a change to them is seen
  # working before it merges (workflow_dispatch reaches a workflow only once the default branch
  # has it). Not a required check, so the path filter leaves nothing waiting.
  pull_request:
    paths:
      - .github/workflows/analysis.yml
      - .github/scripts/zig-fuzz.sh
      - .github/scripts/zig-valgrind.sh
      - .github/valgrind.supp
      - .github/scripts/zig-race-tests.sh
      - .github/scripts/zig-stress.sh

permissions: {}

# A pull request's new push replaces the run of its old one.
concurrency:
  group: analysis-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    strategy:
      fail-fast: false
      # About five minutes of fuzzing each on GitHub's runner, from the first run's speeds (2,000
      # runs a second for regular expressions, HPACK and minisign, 25,000 for references and
      # manifests; the build before them takes about two minutes). zig-fuzz.sh gives each 30,
      # since a corpus that grows slows its target, and a run past them is taken for a hang.
      matrix:
        include:
          # Slows as its corpus grows (more files per layer): 3M took 27 minutes with a kept one.
          - { target: OCI layer, runs: 1M }
          - { target: OCI references and challenges, runs: 8M }
          - { target: OCI manifests, runs: 8M }
          - { target: expressions, runs: 1M }
          - { target: YAML, runs: 5M }
          - { target: regular expressions, runs: 1M }
          - { target: HPACK, runs: 1M }
          - { target: hashFiles patterns, runs: 1M }
          - { target: minisign, runs: 1M }
          - { target: workflow commands, runs: 3M }
          - { target: problem matchers, runs: 3M }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        run: .github/scripts/install-zig.sh

      # The cache key's name for the target: "OCI layer" is fuzz-OCI-layer-.
      - name: The corpus's key
        id: key
        env:
          TARGET: ${{ matrix.target }}
        run: echo "prefix=fuzz-${TARGET// /-}-" >>"$GITHUB_OUTPUT"

      # The newest corpus of this target (keys are per run: a cache entry cannot be overwritten).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runner/.zig-cache/f
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          RUNS: ${{ inputs.runs || matrix.runs }}
        run: .github/scripts/zig-fuzz.sh "$TARGET" "$RUNS" 30 "$RUNNER_TEMP/fuzz"

      # Kept whatever happened: what the fuzzer found up to a crash is worth starting from.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: runner/.zig-cache/f
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ${{ steps.key.outputs.prefix }}input
          path: ${{ runner.temp }}/fuzz
          if-no-files-found: ignore

  # About ten minutes on GitHub's runner.
  valgrind:
    name: Valgrind
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        run: .github/scripts/install-zig.sh

      # Ubuntu's own package, checked by apt against the archive's signed index.
      - name: Install Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind
          valgrind --version

      - name: Tests under memcheck
        run: .github/scripts/zig-valgrind.sh

  # The concurrency-sensitive tests under load. About 11 s a round on an idle runner.
  stress:
    name: Stress
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read # to check out the code
    # The database's tests run too (ci.yml's Database tests job, whose database this is), and fail
    # without it rather than skip.
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: tsdb
      PGSSLMODE: disable
      ZIG_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the database
        run: .github/scripts/ci-database.sh start

      - name: Install Zig
        run: .github/scripts/install-zig.sh

      # Ubuntu's own package, checked by apt against the archive's signed index, at the version
      # pinned here, so every night loads the machine the same way.
      - name: Install stress-ng
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends stress-ng=0.20.01-1
          stress-ng --version

      - name: Wait for the database
        run: .github/scripts/ci-database.sh wait

      - name: Tests under load
        run: .github/scripts/zig-stress.sh 100 "$RUNNER_TEMP/stress"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: stress-output
          path: ${{ runner.temp }}/stress
          if-no-files-found: ignore

