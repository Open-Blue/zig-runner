name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main and those queued before it; without
  # this its required checks never report.
  merge_group:

# Nothing by default; each job asks for what it needs.
permissions: {}

# Every job has a time limit well above how long it takes: without one, a hung job holds its runner
# for GitHub's default of six hours, and on prod that runner is the project's own.

# A pull request's new push replaces the run of its old one; main's runs all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The workflows themselves: actionlint for mistakes, zizmor for security; the shell scripts
  # they and the deployment run, with shellcheck and shfmt; and the Dockerfile, with hadolint
  # (docs/CI.md). Also the checks that each took a runner of their own for seconds, and waited
  # minutes for it in the merge queue: the branch name, ZLint and the Go tools. Each of those runs
  # whatever failed before it (`!cancelled()`), so one failure hides none of the others.
  workflows:
    name: Workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # to check out the workflows and the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The prefix decides the version a merge into main releases (CONTRIBUTING.md, "Versioning").
      - name: Branch name
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            feature/?* | feat/?* | bugfix/?* | hotfix/?* | ci/?* | release/?* | docs/?* | perf/?* | refactor/?*) ;;
            renovate/?*) ;;
            *)
              echo "::error::'$BRANCH' needs one of the prefixes feature/, feat/, bugfix/, hotfix/, ci/, release/, docs/, perf/ or refactor/ (CONTRIBUTING.md, \"Versioning\")"
              exit 1
              ;;
          esac

      # ZLint over the runner's Zig (.github/scripts/zlint.sh, its rules in runner/zlint.json): CodeQL
      # and Semgrep read no Zig, so this is the only static analysis of the runner's own code besides
      # the compiler. A few seconds, with no Zig to install. Skipped on a change that cannot affect
      # it (ci-scope.sh tests). Its suppressed-errors rule runs here too, against the baseline of the
      # sites read and meant: the rule cannot be on in runner/zlint.json (zlint.sh says why), and run
      # only by analysis.yml's nightly it let two `catch {}` sites (#327, #332) merge and fail that
      # night. The same binary, so about two seconds more.
      - name: Whether this change can affect the lint
        id: lint_scope
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: ZLint
        if: ${{ !cancelled() && steps.lint_scope.outputs.run == 'true' }}
        run: .github/scripts/zlint.sh

      - name: ZLint (suppressed-errors)
        if: ${{ !cancelled() && steps.lint_scope.outputs.run == 'true' }}
        run: .github/scripts/zlint.sh suppressed-errors

      # The comparison tools' Go (runner/tools/*diff), with go vet, staticcheck and the race
      # detector (go-lint.sh): they are test oracles, so a bug in one hides one in the runner.
      # Skipped on a change that cannot affect them (ci-scope.sh go); compare.yml runs it weekly
      # whatever changed. Go is on GitHub's runner; it fetches the pinned staticcheck and the
      # toolchain the go.mods name, checked against Go's checksum database.
      - name: Whether this change can affect the Go tools
        id: go_scope
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh go

      - name: go vet, staticcheck and the race detector
        if: ${{ !cancelled() && steps.go_scope.outputs.run == 'true' }}
        run: .github/scripts/go-lint.sh

      # Go's module proxy and checksum database verify what this downloads.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # The names the release waits for on main (.github/checks-on-main, release.yml's
      # EXTRA_CHECKS) and the checks the rulesets require are jobs that run then: a check renamed
      # in one place and not the others held a release for 30 minutes on 2026-11-07. The rulesets
      # are read with the job's token (metadata only).
      - name: Check names the pipeline waits for
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-names.sh

      # The image is pinned by digest. deploy/zig-runner-deploy runs on prod every minute.
      - name: shellcheck
        run: .github/scripts/shellcheck.sh

      # The release binaries, against their pinned checksums: a new version (Renovate's) fails
      # here until they are updated. shfmt shows the diff that would format a script.
      - name: shfmt
        run: .github/scripts/shfmt.sh

      - name: hadolint
        run: .github/scripts/hadolint.sh

      # The casts and assertions that skip Zig's checks (@bitCast, @ptrCast, @alignCast, @intCast,
      # `catch unreachable`) in runner/src, against their checked-in counts: a new one raises
      # unsafe-ratchet.baseline in the same pull request, where a reviewer sees it.
      - name: Unsafe constructs ratchet
        run: .github/scripts/unsafe-ratchet.sh

      # The runner's check of the tool cache's trees (runner/src/dagger/tool_trees.sh), on a small
      # fake tree: its lists let it skip re-reading unchanged files, never a changed, added or
      # deleted one, and a list a job writes into the tool cache is never read.
      - name: Tool cache tree check
        run: .github/scripts/tool-trees-test.sh

      # apt.sh's fallback to a mirror, in a container whose route to Ubuntu's archive is cut: the
      # install still works, with apt's keyrings unchanged. Uses the real mirrors.
      - name: apt mirror fallback
        run: .github/scripts/apt-test.sh

      # The changie the release installs, against its pinned checksum: a new version (Renovate's)
      # fails here until the checksum is updated, not at the release, after it was approved.
      - name: changie's checksum
        run: .github/scripts/install-changie.sh

      # Every unreleased entry, batched as the release will (dry run): a change file that is not
      # valid YAML (an unescaped ' in a single-quoted body broke v0.24.0's Tag step) fails here, on
      # the pull request that adds it, not after the release is approved.
      - name: changie's entries
        run: |
          if compgen -G '.changes/unreleased/*.yaml' >/dev/null; then
            changie batch auto --dry-run >/dev/null
          fi

      # The busybox the runner puts into job containers (runner/src/dagger.zig), pinned by digest:
      # checked to be a pullable multi-arch index (amd64 and arm64) with the applets Docker actions,
      # services and output keys use, so a Renovate busybox pull request, or a re-wrapped literal,
      # fails here, not on a runner. Docker Hub is asked anonymously from GitHub's shared addresses:
      # only a fetch that fails (exit 75) is tried again, twice, after a pause, as for zizmor.
      - name: busybox's pin
        run: |
          for attempt in 1 2 3; do
            status=0
            .github/scripts/busybox-pin.sh || status=$?
            ((status == 75 && attempt < 3)) || exit "$status"
            echo "::warning::busybox-pin.sh could not reach Docker Hub (attempt $attempt of 3): trying again"
            sleep $((attempt * 15))
          done

      # The default job image (runner/src/dagger.zig), the shared base of every job, pinned by
      # digest: checked to be a multi-arch index (amd64 and arm64) whose bytes hash to the pin, so
      # a Renovate ubuntu pull request, or a re-wrapped literal, fails here, not on a runner. Asked
      # of Docker Hub's registry API anonymously, with curl: only a fetch that fails (exit 75) is
      # tried again, twice, after a pause, as for busybox.
      - name: ubuntu's pin
        run: |
          for attempt in 1 2 3; do
            status=0
            .github/scripts/ubuntu-pin.sh || status=$?
            ((status == 75 && attempt < 3)) || exit "$status"
            echo "::warning::ubuntu-pin.sh could not reach Docker Hub (attempt $attempt of 3): trying again"
            sleep $((attempt * 15))
          done

      # The provisioned images (runner/src/dagger/provisioned_pin.zig), pinned by digest once the
      # "provisioned image" workflow published them: checked to be indexes for amd64 and arm64
      # whose images are labelled with the fingerprint the pin says, so a pin of a missing or
      # another image fails here, not on a runner. (That the fingerprint is the current script's
      # and base image's is a unit test.) With nothing pinned there is nothing to ask. Asked of
      # ghcr.io anonymously; only a fetch that fails (exit 75) is tried again, as for ubuntu.
      - name: provisioned images' pin
        run: |
          for attempt in 1 2 3; do
            status=0
            .github/scripts/provisioned-pin.sh check || status=$?
            ((status == 75 && attempt < 3)) || exit "$status"
            echo "::warning::provisioned-pin.sh could not reach ghcr.io (attempt $attempt of 3): trying again"
            sleep $((attempt * 15))
          done

      # zizmor's online audits ask GitHub (its advisories, the pinned commits). A request that fails
      # makes zizmor exit 1, the code for its own failure, which once took a pull request out of
      # the merge queue (#194). Only that is tried again, twice, after a pause: findings (exit 10
      # to 14) and anything else fail at once, and the online audits run everywhere.
      - name: zizmor
        env:
          # Read-only; zizmor asks GitHub whether the pinned actions' commits are what they say.
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            status=0
            .github/scripts/zizmor.sh --format github .github/workflows || status=$?
            ((status == 1 && attempt < 3)) || exit "$status"
            echo "::warning::zizmor could not run (exit 1; attempt $attempt of 3), most likely a failed request to GitHub: trying again"
            sleep $((attempt * 15))
          done

  # The database tests, which skip themselves without a database: here against TimescaleDB, as
  # deployments use, and required to run (ZIG_TEST_REQUIRE_DB), so this job cannot pass by skipping
  # them. On GitHub's runner. Every test runs here, so here they run under ThreadSanitizer, which
  # fails them on a data race. The database is started by a step, not as a service container, which
  # GitHub would start (about 25 s) before the first step: so it comes up while the tests compile,
  # and is waited for just before they run (ci-database.sh). Skipped, still reporting, on a change
  # that cannot affect the tests (ci-scope.sh). In three parts (ZIG_TEST_PART=K/N, every N-th
  # test, as `native-root`), each with its own database: in one, at about 280 s, it was the longest
  # job of a merge-queue run, and of two parts one ran its tests for 129 s, the other for 21 s.
  # Each part is a required check of its own (the "main and release branches" ruleset) and in
  # .github/checks-on-main.
  database:
    name: Database tests (${{ matrix.part }}/3)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # to check out the code
    strategy:
      # Every part reports: one failing does not hide what the other finds.
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      ZIG_TEST_PART: ${{ matrix.part }}/3
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: tsdb
      PGSSLMODE: disable
      ZIG_TEST_REQUIRE_DB: "1"
      ZIG_TEST_SANITIZE_THREAD: "1"
      ZIG_TEST_WAIT_FOR_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Start the database
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/ci-database.sh start

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # Without `zig build`, whose first step here would be compiling Zig's build system (about
      # 100 s): this job's cache always starts empty (zig-test.sh).
      - name: Test, with the database
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/zig-test.sh

  # A push to main runs on prod, this project's own runner, so every merge exercises it; pull
  # requests and the merge queue run on GitHub's runner on purpose, cold every time, the worst case
  # for a build (docs/OPERATIONS.md, "Environments"). The repository variables PROD_RUNNER and PREPROD_RUNNER
  # hold runs-on labels as JSON (["self-hosted","prod"]); PREPROD_RUNNER is left unset, and unset
  # means GitHub's runner. Its image is pinned (ubuntu-26.04, not ubuntu-latest) on purpose: an
  # image change moves what the native passes stand on (AppArmor's userns restriction, idmapped
  # mounts, nftables), so upgrade it deliberately, here and in the other workflows together.
  test:
    name: Tests (x86_64)
    runs-on: ${{ fromJSON(github.event_name == 'push' && (vars.PROD_RUNNER || '"ubuntu-26.04"') || (vars.PREPROD_RUNNER || '"ubuntu-26.04"')) }}
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skipped, still reporting, on a change that cannot affect them (ci-scope.sh); never on main.
      - name: Whether this change can affect the build and tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # Named, not `.`: zig-pkg/ holds the dependencies once anything has built, in their own style.
      - name: Format check
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: zig fmt --check build.zig build.zig.zon src tools

      # runner/src/expr.zig against GitHub's own expression test cases (actions/languageservices):
      # fails on a case that broke, or on one that now passes and is still listed as failing.
      - name: Expressions against GitHub's test cases
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/expr-conformance.sh

      # The database tests skip themselves here: the Database tests job runs them. On GitHub's
      # runners, whose cache always starts empty, without `zig build` (zig-test.sh); on the
      # project's own, whose cache is kept, through it, as developers build. On the Pi (ARM64),
      # -j1 compiles the tests and the runner one after the other: together they peak at about
      # 1.7 GB, one at a time about 1 GB, so two jobs fit under the engine's 4 GB cap instead of
      # queueing behind its memory gate. Each job takes about 25 s longer, and the pool finishes
      # about 38% more of them. The tests' output is only text to this job, never its workflow
      # commands: the native backend's tests write `##[error]` lines into their jobs' logs (the
      # process and memory limits), which would otherwise become this job's annotations
      # (zig-test.sh does the same for its own runs).
      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            # GitHub's runner can make the native backend's sandboxes, so its tests must run here,
            # not skip (src/native/Backend.zig, `testConfig`): rootless here; as root, the path
            # with each job's own ids and network (nft makes its NAT), in `native-root`.
            # Ubuntu's AppArmor (24.04 on) blocks unprivileged user namespaces; lift it on this throwaway VM.
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
            ZIG_RUNNER_REQUIRE_NATIVE=1 ../.github/scripts/zig-test.sh
          else
            stop="tests-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$stop" >&2
            status=0
            if [ "$RUNNER_ARCH" = ARM64 ]; then
              zig build test -j1 --summary all || status=$?
            else
              zig build test --summary all || status=$?
            fi
            echo "::$stop::" >&2
            exit "$status"
          fi

      # The same tests in a Docker container, where the working directory is overlayfs, as on the
      # project's own runner (a push to main): pull requests and the merge queue otherwise test on
      # the VM's ext4, which agrees with overlayfs on nearly everything and not on all (#332's test
      # passed on every pull request and failed on every push to main, as overlayfs grants a read
      # lease over a writable mapping). The native backend's tests skip in it, as there: Docker's
      # seccomp refuses their namespaces, and the passes above ran them. The compile is the tests'
      # above, cached (zig-test.sh, ZIG_TEST_IN_CONTAINER). Over 700 tests pass in it (a floor of
      # 500 is held, ZIG_TEST_MIN_PASSED), so a mistake that skips them cannot stay green. The two
      # chains of directories tens of thousands deep skip there at once (evict.zig,
      # `needsDeepDirs`): overlayfs refuses them, after nine minutes of building them.
      - name: Test, on overlayfs
        if: steps.scope.outputs.run == 'true' && runner.environment == 'github-hosted'
        # Several times the step's time, so a test that does not finish fails here, not at the
        # job's limit.
        timeout-minutes: 5
        working-directory: runner
        env:
          ZIG_TEST_IN_CONTAINER: "1"
          ZIG_TEST_MIN_PASSED: "500"
        run: ../.github/scripts/zig-test.sh

      # Eviction's floor on a disk that is really full: a 64 MiB tmpfs in a mount namespace of the
      # test's own (bubblewrap, no root), filled until a write fails (full-disk-test.sh, #357). The
      # test skips everywhere else, so it would otherwise never run. Its compile is the tests'
      # above, cached.
      - name: Eviction on a really full disk
        if: steps.scope.outputs.run == 'true' && runner.environment == 'github-hosted'
        timeout-minutes: 5
        env:
          FULL_DISK_REQUIRED: "1"
        run: |
          sudo .github/scripts/apt.sh install bubblewrap
          .github/scripts/full-disk-test.sh

      # Every test in runner/src is one the test binary has: a file that nothing reached compiled
      # and passed with its tests never run (github/http.zig's, until #326). Its compile is the
      # tests' on a runner that ran them with zig-test.sh, cached.
      # Built by the weekly comparison (`hashfiles-diff.sh`), which pull requests do not run: #366
      # would have broken it unseen.
      - name: The hashFiles comparison tool compiles
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: zig build-exe --dep runner --dep corpus -Mroot=tools/hashfilescorpus.zig -Mrunner=src/hashfiles_corpus.zig -Mcorpus=tools/corpus.zig --name hashfilescorpus -fno-emit-bin

      - name: Every test file is compiled
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/test-files.sh

  # The native backend's tests as root, on both architectures, in two parts each. As root they run
  # one at a time (a root job takes the host's first free slot of ids and addresses,
  # runner/tools/test_shards.zig, `serial`): about 200 s on one runner, which held the whole run
  # back. ZIG_TEST_PART=K/N gives each part every N-th test, so the parts run side by side and
  # together are the suite. Each part is a required check of its own (the "main and release
  # branches" ruleset). Not on main: a push runs `zig build test` on prod (`test`).
  native-root:
    name: Native tests as root (${{ matrix.arch }}, ${{ matrix.part }}/2)
    if: github.event_name != 'push'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    strategy:
      # Every part reports: one failing does not hide what the others find.
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # As the tests' output in `test`: only text to this job, never its workflow commands
      # (zig-test.sh stops them).
      - name: Test, as root
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        env:
          PART: ${{ matrix.part }}/2
        run: |
          # Ubuntu's AppArmor (24.04 on) blocks unprivileged user namespaces; lift it on this throwaway VM.
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          # Real postgres and redis images for the native services test (native/services.zig),
          # which needs root: their entrypoints change to the images' own users.
          ../.github/scripts/native-service-images.sh "$RUNNER_TEMP/native-images"
          ZIG_RUNNER_REQUIRE_NATIVE=1 ZIG_TEST_NATIVE_AS_ROOT=1 ZIG_TEST_PART="$PART" \
            ZIG_RUNNER_SERVICE_IMAGES="$RUNNER_TEMP/native-images" ../.github/scripts/zig-test.sh

  # The release's own builds, both targets in ReleaseSafe (build-binaries.sh), which nothing else
  # compiles before the tag: the tests build x86_64 in Debug, and release.yml's checks run only for
  # a change to the packaging. Code that compiles there and not for aarch64, or not in ReleaseSafe,
  # would otherwise fail first at the release, after the tag, which cannot be cut again. About a
  # minute, beside the Database tests' two. Skipped, still reporting, on a change that cannot
  # affect them (ci-scope.sh binaries); not on main, whose commits the merge queue built, and whose
  # tag's release builds them anyway.
  binaries:
    name: Release builds
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the release's builds
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh binaries

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: Build for x86_64 and aarch64
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/build-binaries.sh v0.0.0-ci "$RUNNER_TEMP/dist"

      # The hardening the release gates on (checksec.sh: static PIE, full RELRO, NX, W^X), checked
      # here too, so a change that loses any of it fails before the tag, not at the release. The
      # x86_64 binary is run once: a static PIE relocates itself at startup, before anything else.
      - name: Hardening
        if: steps.scope.outputs.run == 'true'
        run: |
          .github/scripts/checksec.sh "$RUNNER_TEMP/dist/zig-runner-linux-x86_64" "$RUNNER_TEMP/dist/zig-runner-linux-aarch64"
          "$RUNNER_TEMP/dist/zig-runner-linux-x86_64" --version

  # The aarch64 release binary, run where it runs: on GitHub's arm64 runner, as on razorbill (a Pi,
  # prod), which would otherwise be the first machine ever to execute it. The release's builds
  # (build-binaries.sh, both targets, so the same commands as Release builds and the tag), checked
  # for their hardening (checksec.sh: static PIE, full RELRO, NX, W^X), the aarch64 binary run once
  # (a static PIE relocates itself at startup, before anything else), then the tests natively on
  # arm64 as the hosted test job runs them on x86_64: rootless, then the native backend's as root.
  # Skipped, still reporting, on a change that can affect neither the release's builds nor the
  # tests (ci-scope.sh binaries and tests); not on main, as Release builds.
  arm64-builds:
    name: Release builds (arm64)
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the release's builds
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh binaries

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: Build for x86_64 and aarch64
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/build-binaries.sh v0.0.0-ci "$RUNNER_TEMP/dist"

      - name: Hardening, and the aarch64 binary run
        if: steps.scope.outputs.run == 'true'
        run: |
          .github/scripts/checksec.sh "$RUNNER_TEMP/dist/zig-runner-linux-aarch64" "$RUNNER_TEMP/dist/zig-runner-linux-x86_64"
          "$RUNNER_TEMP/dist/zig-runner-linux-aarch64" --version

  # The tests on arm64, rootless; as root they are `native-root`'s. Apart from the release builds
  # (`arm64-builds`), which used to run first in the same job and held the tests back.
  arm64-test:
    name: Tests (arm64)
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Razorbill (a Pi) runs 16 KiB pages; GitHub's arm64 runner does not, so a test that depends
      # on the page size passes here on 4 KiB and is not seen at 16: said in the log, so a runner
      # image that changes it is noticed.
      - name: Page size
        run: |
          echo "page size: $(getconf PAGESIZE) bytes, kernel $(uname -r)"
          echo "::notice title=arm64 page size::GitHub's arm64 runner has $(getconf PAGESIZE)-byte pages; razorbill has 16384"

      - name: Whether this change can affect the tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # As the hosted test job's Test step: the native backend's tests must run here, not skip.
      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: |
          # Ubuntu's AppArmor (24.04 on) blocks unprivileged user namespaces; lift it on this throwaway VM.
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          ZIG_RUNNER_REQUIRE_NATIVE=1 ../.github/scripts/zig-test.sh

  # The end-to-end suite (.github/scripts/e2e.sh): the runner built from this change serves
  # runner-bench's e2e workflows (Open-Blue/runner-bench, e2e.yml and e2e-cancel.yml) on GitHub's
  # runner, through GitHub's broker and a real Dagger engine, once on Dagger and once native, and
  # the suite checks the jobs, their steps and their logs through the API: a script installing into
  # the tool cache (v0.22.0 broke that), a service, a docker:// step, a JavaScript action, the file
  # commands, a masked secret, a cancelled run, and a rerun replayed from the step cache. The tests
  # run every step against a fake engine session; this is the only check before a merge of the real
  # thing, which otherwise first ran on prod. Each job's times on both backends go to the
  # e2e-timings artifact.
  #
  # Everything on runner-bench is done as the GitHub App zig-runner-e2e (installed there only):
  # the runner registers its just-in-time runners with its key, under a label of this run's own,
  # and the suite dispatches and reads the workflows with one of its installation tokens. The key
  # is the e2e environment's secret, which pull requests from forks do not get: without it (or its
  # App ID, the environment's variable), the job skips its steps, still reporting, as it does on a
  # change that cannot affect the runner (ci-scope.sh e2e). Not a required check yet; not on main,
  # whose commits the merge queue checked.
  e2e:
    name: End to end
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    # Setup takes about 4 minutes, a pass 2 to 3, and the whole job 5 to 10; the limit is what a hang
    # costs. The two passes' step limits below (11 and 12 minutes) are their worst cases, so that a
    # hang ends in a step with its own message, and the log steps after it still run.
    timeout-minutes: 30
    environment: e2e
    env:
      # Each wait for a run (or the native rootfs), and all of `check`'s waits together (e2e.sh): a
      # hang is reported by the script, 240 s and 300 s, well inside the steps' limits.
      E2E_TIMEOUT: 240
      E2E_SUITE_LIMIT: 300
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the runner
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh e2e

      # Whether the key is set, as true or false: the key itself goes only to the steps that use it.
      - name: Whether the suite's GitHub App is set up
        id: go
        env:
          SCOPE: ${{ steps.scope.outputs.run }}
          HAVE_KEY: ${{ secrets.E2E_GH_APP_PRIVATE_KEY != '' }}
          APP_ID: ${{ vars.E2E_GH_APP_ID }}
        run: |
          if [ "$SCOPE" != true ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          elif [ "$HAVE_KEY" != true ] || [ -z "$APP_ID" ]; then
            echo "::notice::End to end skipped: the e2e environment's secret E2E_GH_APP_PRIVATE_KEY or variable E2E_GH_APP_ID is not available (a pull request from a fork, or not set up yet)"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      # Pulled and started in the background, while Zig installs and the runner compiles.
      - name: Start the engine
        if: steps.go.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          nohup .github/scripts/e2e.sh engine >"$RUNNER_TEMP/e2e/engine.log" 2>&1 &

      - name: Install Zig
        if: steps.go.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: Build the runner
        if: steps.go.outputs.run == 'true'
        run: .github/scripts/e2e.sh build "$RUNNER_TEMP/zig-runner"

      # The native pass's rootfs (apt in a container, about a minute), in the background: done
      # while the Dagger pass runs (when it does), before the native one, which waits for it.
      - name: Make the native rootfs
        if: steps.go.outputs.run == 'true'
        run: nohup .github/scripts/e2e.sh rootfs "$RUNNER_TEMP/zig-runner" >"$RUNNER_TEMP/e2e/rootfs.log" 2>&1 &

      # What the suite needs on runner-bench, and nothing else the App may do.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.go.outputs.run == 'true'
        id: app
        with:
          client-id: ${{ vars.E2E_GH_APP_ID }}
          private-key: ${{ secrets.E2E_GH_APP_PRIVATE_KEY }}
          owner: Open-Blue
          repositories: runner-bench
          permission-actions: write

      # The runner's own copy, as deployments give it one (GH_APP_PRIVATE_KEY_FILE); removed at
      # the end.
      - name: The runner's key
        if: steps.go.outputs.run == 'true'
        env:
          KEY: ${{ secrets.E2E_GH_APP_PRIVATE_KEY }}
        run: (umask 077 && printf '%s\n' "$KEY" >"$RUNNER_TEMP/e2e-app.pem")

      - name: End to end on Dagger
        id: e2e_dagger
        # Not on a pull request or in the merge queue, where it cost a pass of about four runner
        # minutes for a result that gated nothing; the native pass is the check there. This job
        # does not run on a push to main or on a schedule either, so the step runs only if one of
        # those events is ever added to it; the Dagger backend is run end to end every night by
        # analysis.yml's "ThreadSanitizer, end to end" (the same suite, a ThreadSanitizer build).
        if: ${{ steps.go.outputs.run == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        # Reported, not a gate: on GitHub's runner the engine is slow enough that the cancel check and
        # the suite's limit fail jobs that are right (#484 and #481 left the merge queue so, with the
        # native pass green and main green). The default backend is still Dagger, so it keeps being
        # run; it goes with the Dagger backend.
        continue-on-error: true
        # Worst case: the engine's wait 180 s, the suite 300 s and the reads after it 90 s, stop 35 s.
        timeout-minutes: 11
        env:
          GH_APP_ID: ${{ vars.E2E_GH_APP_ID }}
          E2E_GH_TOKEN: ${{ steps.app.outputs.token }}
          E2E_ZIG_RUNNER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          label="e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-dagger"
          GH_APP_PRIVATE_KEY_FILE="$RUNNER_TEMP/e2e-app.pem" .github/scripts/e2e.sh start "$RUNNER_TEMP/zig-runner" dagger "$label"
          status=0
          .github/scripts/e2e.sh check "$label" dagger || status=$?
          .github/scripts/e2e.sh stop
          exit "$status"

      # Run whatever Dagger's pass found, when it ran, so one run shows both. The engine is still
      # started: the native backend hands some jobs to Dagger.
      - name: End to end, native
        if: ${{ !cancelled() && steps.go.outputs.run == 'true' }}
        # Worst case: the rootfs's wait 240 s, the suite 300 s and the reads after it 90 s, stop 35 s.
        timeout-minutes: 12
        env:
          GH_APP_ID: ${{ vars.E2E_GH_APP_ID }}
          E2E_GH_TOKEN: ${{ steps.app.outputs.token }}
          E2E_ZIG_RUNNER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          label="e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-native"
          GH_APP_PRIVATE_KEY_FILE="$RUNNER_TEMP/e2e-app.pem" .github/scripts/e2e.sh start "$RUNNER_TEMP/zig-runner" native "$label"
          status=0
          .github/scripts/e2e.sh check "$label" native || status=$?
          .github/scripts/e2e.sh stop
          exit "$status"

      # The runner masks the jobs' secrets in its own log; any token-shaped string is masked again.
      # The jobs' own workflow commands in it (`##[error]`, `::add-mask::`) are only text here.
      - name: The runner's log, on a failure
        # The Dagger pass does not fail the job (`continue-on-error`), so its failure is asked for.
        if: ${{ (failure() || steps.e2e_dagger.outcome == 'failure') && steps.go.outputs.run == 'true' }}
        run: |
          for f in "$RUNNER_TEMP"/e2e/engine.log "$RUNNER_TEMP"/e2e/rootfs.log "$RUNNER_TEMP"/e2e/runner-*.log; do
            [ -e "$f" ] || continue
            stop="e2e-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::group::$(basename "$f")"
            echo "::stop-commands::$stop"
            tail -n 300 "$f" | sed -E 's/(gh[opsu]|github_pat)_[A-Za-z0-9_]{20,}/***/g'
            echo "::$stop::"
            echo "::endgroup::"
          done

      - name: Clean up
        if: ${{ always() && steps.go.outputs.run == 'true' }}
        run: |
          .github/scripts/e2e.sh stop || true
          rm -f "$RUNNER_TEMP/e2e-app.pem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.go.outputs.run == 'true' }}
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/e2e/timings.tsv
          if-no-files-found: ignore
