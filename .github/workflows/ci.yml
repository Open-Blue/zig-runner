name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main and those queued before it; without
  # this its required checks never report.
  merge_group:

# Nothing by default; each job asks for what it needs.
permissions: {}

# Every job has a time limit well above how long it takes: without one, a hung job holds its runner
# for GitHub's default of six hours, and on prod that runner is the project's own.

# A pull request's new push replaces the run of its old one; main's runs all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The prefix decides the version a merge into main releases (README, "Versioning").
  branch:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            feature/?* | feat/?* | bugfix/?* | hotfix/?* | ci/?* | release/?* | docs/?* | perf/?* | refactor/?*) ;;
            renovate/?*) ;;
            *)
              echo "::error::'$BRANCH' needs one of the prefixes feature/, feat/, bugfix/, hotfix/, ci/, release/, docs/, perf/ or refactor/ (README, \"Versioning\")"
              exit 1
              ;;
          esac

  # The workflows themselves: actionlint for mistakes, zizmor for security; and the shell scripts
  # they and the deployment run, with shellcheck (README, "Pipeline").
  workflows:
    name: Workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go's module proxy and checksum database verify what this downloads.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # The image is pinned by digest. deploy/zig-runner-deploy runs on prod every minute.
      - name: shellcheck
        run: .github/scripts/shellcheck.sh

      # The runner's check of the tool cache's trees (runner/src/dagger/tool_trees.sh), on a small
      # fake tree: its lists let it skip re-reading unchanged files, never a changed, added or
      # deleted one, and a list a job writes into the tool cache is never read.
      - name: Tool cache tree check
        run: .github/scripts/tool-trees-test.sh

      # The changie the release installs, against its pinned checksum: a new version (Renovate's)
      # fails here until the checksum is updated, not at the release, after it was approved.
      - name: changie's checksum
        run: .github/scripts/install-changie.sh

      # The busybox the runner puts into job containers (runner/src/dagger.zig), pinned by digest:
      # checked to be a pullable multi-arch index (amd64 and arm64) with the applets Docker actions,
      # services and output keys use, so a Renovate busybox pull request, or a re-wrapped literal,
      # fails here, not on a runner. Docker Hub is asked anonymously from GitHub's shared addresses:
      # only a fetch that fails (exit 75) is tried again, twice, after a pause, as for zizmor.
      - name: busybox's pin
        run: |
          for attempt in 1 2 3; do
            status=0
            .github/scripts/busybox-pin.sh || status=$?
            ((status == 75 && attempt < 3)) || exit "$status"
            echo "::warning::busybox-pin.sh could not reach Docker Hub (attempt $attempt of 3): trying again"
            sleep $((attempt * 15))
          done

      # The default job image (runner/src/dagger.zig), the shared base of every job, pinned by
      # digest: checked to be a multi-arch index (amd64 and arm64) whose bytes hash to the pin, so
      # a Renovate ubuntu pull request, or a re-wrapped literal, fails here, not on a runner. Asked
      # of Docker Hub's registry API anonymously, with curl: only a fetch that fails (exit 75) is
      # tried again, twice, after a pause, as for busybox.
      - name: ubuntu's pin
        run: |
          for attempt in 1 2 3; do
            status=0
            .github/scripts/ubuntu-pin.sh || status=$?
            ((status == 75 && attempt < 3)) || exit "$status"
            echo "::warning::ubuntu-pin.sh could not reach Docker Hub (attempt $attempt of 3): trying again"
            sleep $((attempt * 15))
          done

      # zizmor's online audits ask GitHub (its advisories, the pinned commits). A request that fails
      # makes zizmor exit 1, the code for its own failure, which once took a pull request out of
      # the merge queue (#194). Only that is tried again, twice, after a pause: findings (exit 10
      # to 14) and anything else fail at once, and the online audits run everywhere.
      - name: zizmor
        env:
          # Read-only; zizmor asks GitHub whether the pinned actions' commits are what they say.
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            status=0
            pipx run zizmor==1.31.1 --format github .github/workflows || status=$?
            ((status == 1 && attempt < 3)) || exit "$status"
            echo "::warning::zizmor could not run (exit 1; attempt $attempt of 3), most likely a failed request to GitHub: trying again"
            sleep $((attempt * 15))
          done

  # The database tests, which skip themselves without a database: here against TimescaleDB, as
  # deployments use, and required to run (ZIG_TEST_REQUIRE_DB), so this job cannot pass by skipping
  # them. On GitHub's runner. Every test runs here, so here they run under ThreadSanitizer, which
  # fails them on a data race. The database is started by a step, not as a service container, which
  # GitHub would start (about 25 s) before the first step: so it comes up while the tests compile,
  # and is waited for just before they run (ci-database.sh). Skipped, still reporting, on a change
  # that cannot affect the tests (ci-scope.sh).
  database:
    name: Database tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # to check out the code
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: tsdb
      PGSSLMODE: disable
      ZIG_TEST_REQUIRE_DB: "1"
      ZIG_TEST_SANITIZE_THREAD: "1"
      ZIG_TEST_WAIT_FOR_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Start the database
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/ci-database.sh start

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # Without `zig build`, whose first step here would be compiling Zig's build system (about
      # 100 s): this job's cache always starts empty (zig-test.sh).
      - name: Test, with the database
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/zig-test.sh

  # A push to main runs on prod, this project's own runner, so every merge exercises it; pull
  # requests and the merge queue run on GitHub's runner on purpose, cold every time, the worst case
  # for a build (README, "Environments"). The repository variables PROD_RUNNER and PREPROD_RUNNER
  # hold runs-on labels as JSON (["self-hosted","prod"]); PREPROD_RUNNER is left unset, and unset
  # means GitHub's runner. Its image is pinned (ubuntu-26.04, not ubuntu-latest) on purpose: an
  # image change moves what the native passes stand on (AppArmor's userns restriction, idmapped
  # mounts, nftables), so upgrade it deliberately, here and in the other workflows together.
  test:
    name: Format, build and test
    runs-on: ${{ fromJSON(github.event_name == 'push' && (vars.PROD_RUNNER || '"ubuntu-26.04"') || (vars.PREPROD_RUNNER || '"ubuntu-26.04"')) }}
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skipped, still reporting, on a change that cannot affect them (ci-scope.sh); never on main.
      - name: Whether this change can affect the build and tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # Named, not `.`: zig-pkg/ holds the dependencies once anything has built, in their own style.
      - name: Format check
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: zig fmt --check build.zig build.zig.zon src tools

      # runner/src/expr.zig against GitHub's own expression test cases (actions/languageservices):
      # fails on a case that broke, or on one that now passes and is still listed as failing.
      - name: Expressions against GitHub's test cases
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/expr-conformance.sh

      # The database tests skip themselves here: the Database tests job runs them. On GitHub's
      # runners, whose cache always starts empty, without `zig build` (zig-test.sh); on the
      # project's own, whose cache is kept, through it, as developers build. On the Pi (ARM64),
      # -j1 compiles the tests and the runner one after the other: together they peak at about
      # 1.7 GB, one at a time about 1 GB, so two jobs fit under the engine's 4 GB cap instead of
      # queueing behind its memory gate. Each job takes about 25 s longer, and the pool finishes
      # about 38% more of them. The tests' output is only text to this job, never its workflow
      # commands: the native backend's tests write `##[error]` lines into their jobs' logs (the
      # process and memory limits), which would otherwise become this job's annotations
      # (zig-test.sh does the same for its own runs).
      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            # GitHub's runner can make the native backend's sandboxes, so its tests must run here,
            # not skip (src/native/Backend.zig, `testConfig`): rootless, then as root, the path
            # with each job's own ids and network (nft makes its NAT).
            # Ubuntu's AppArmor (24.04 on) blocks unprivileged user namespaces; lift it on this throwaway VM.
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
            ZIG_RUNNER_REQUIRE_NATIVE=1 ../.github/scripts/zig-test.sh
            # Real postgres and redis images for the native services test (native/services.zig),
            # which needs root: their entrypoints change to the images' own users.
            ../.github/scripts/native-service-images.sh "$RUNNER_TEMP/native-images"
            ZIG_RUNNER_REQUIRE_NATIVE=1 ZIG_TEST_NATIVE_AS_ROOT=1 \
              ZIG_RUNNER_SERVICE_IMAGES="$RUNNER_TEMP/native-images" ../.github/scripts/zig-test.sh
          else
            stop="tests-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$stop" >&2
            status=0
            if [ "$RUNNER_ARCH" = ARM64 ]; then
              zig build test -j1 --summary all || status=$?
            else
              zig build test --summary all || status=$?
            fi
            echo "::$stop::" >&2
            exit "$status"
          fi

  # The release's own builds, both targets in ReleaseSafe (build-binaries.sh), which nothing else
  # compiles before the tag: the tests build x86_64 in Debug, and release.yml's checks run only for
  # a change to the packaging. Code that compiles there and not for aarch64, or not in ReleaseSafe,
  # would otherwise fail first at the release, after the tag, which cannot be cut again. About a
  # minute, beside the Database tests' two. Skipped, still reporting, on a change that cannot
  # affect them (ci-scope.sh binaries); not on main, whose commits the merge queue built, and whose
  # tag's release builds them anyway.
  binaries:
    name: Release builds
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the release's builds
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh binaries

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: Build for x86_64 and aarch64
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/build-binaries.sh v0.0.0-ci "$RUNNER_TEMP/dist"

  # The end-to-end suite (.github/scripts/e2e.sh): the runner built from this change serves
  # runner-bench's e2e workflows (Open-Blue/runner-bench, e2e.yml and e2e-cancel.yml) on GitHub's
  # runner, through GitHub's broker and a real Dagger engine, once on Dagger and once native, and
  # the suite checks the jobs, their steps and their logs through the API: a script installing into
  # the tool cache (v0.22.0 broke that), a service, a docker:// step, a JavaScript action, the file
  # commands, a masked secret, a cancelled run, and a rerun replayed from the step cache. The tests
  # run every step against a fake engine session; this is the only check before a merge of the real
  # thing, which otherwise first ran on prod. Each job's times on both backends go to the
  # e2e-timings artifact.
  #
  # Everything on runner-bench is done as the GitHub App zig-runner-e2e (installed there only):
  # the runner registers its just-in-time runners with its key, under a label of this run's own,
  # and the suite dispatches and reads the workflows with one of its installation tokens. The key
  # is the e2e environment's secret, which pull requests from forks do not get: without it (or its
  # App ID, the environment's variable), the job skips its steps, still reporting, as it does on a
  # change that cannot affect the runner (ci-scope.sh e2e). Not a required check yet; not on main,
  # whose commits the merge queue checked.
  e2e:
    name: End to end
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    environment: e2e
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the runner
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh e2e

      # Whether the key is set, as true or false: the key itself goes only to the steps that use it.
      - name: Whether the suite's GitHub App is set up
        id: go
        env:
          SCOPE: ${{ steps.scope.outputs.run }}
          HAVE_KEY: ${{ secrets.E2E_GH_APP_PRIVATE_KEY != '' }}
          APP_ID: ${{ vars.E2E_GH_APP_ID }}
        run: |
          if [ "$SCOPE" != true ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          elif [ "$HAVE_KEY" != true ] || [ -z "$APP_ID" ]; then
            echo "::notice::End to end skipped: the e2e environment's secret E2E_GH_APP_PRIVATE_KEY or variable E2E_GH_APP_ID is not available (a pull request from a fork, or not set up yet)"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      # Pulled and started in the background, while Zig installs and the runner compiles.
      - name: Start the engine
        if: steps.go.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          nohup .github/scripts/e2e.sh engine >"$RUNNER_TEMP/e2e/engine.log" 2>&1 &

      - name: Install Zig
        if: steps.go.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: Build the runner
        if: steps.go.outputs.run == 'true'
        run: .github/scripts/e2e.sh build "$RUNNER_TEMP/zig-runner"

      # The native pass's rootfs (apt in a container, about a minute), in the background: done
      # while the Dagger pass runs, before the native one, which waits for it.
      - name: Make the native rootfs
        if: steps.go.outputs.run == 'true'
        run: nohup .github/scripts/e2e.sh rootfs "$RUNNER_TEMP/zig-runner" >"$RUNNER_TEMP/e2e/rootfs.log" 2>&1 &

      # What the suite needs on runner-bench, and nothing else the App may do.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.go.outputs.run == 'true'
        id: app
        with:
          client-id: ${{ vars.E2E_GH_APP_ID }}
          private-key: ${{ secrets.E2E_GH_APP_PRIVATE_KEY }}
          owner: Open-Blue
          repositories: runner-bench
          permission-actions: write

      # The runner's own copy, as deployments give it one (GH_APP_PRIVATE_KEY_FILE); removed at
      # the end.
      - name: The runner's key
        if: steps.go.outputs.run == 'true'
        env:
          KEY: ${{ secrets.E2E_GH_APP_PRIVATE_KEY }}
        run: (umask 077 && printf '%s\n' "$KEY" >"$RUNNER_TEMP/e2e-app.pem")

      - name: End to end on Dagger
        if: steps.go.outputs.run == 'true'
        env:
          GH_APP_ID: ${{ vars.E2E_GH_APP_ID }}
          E2E_GH_TOKEN: ${{ steps.app.outputs.token }}
          E2E_ZIG_RUNNER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          label="e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-dagger"
          GH_APP_PRIVATE_KEY_FILE="$RUNNER_TEMP/e2e-app.pem" .github/scripts/e2e.sh start "$RUNNER_TEMP/zig-runner" dagger "$label"
          status=0
          .github/scripts/e2e.sh check "$label" dagger || status=$?
          .github/scripts/e2e.sh stop
          exit "$status"

      # Run whatever Dagger's pass found, so one push shows both.
      - name: End to end, native
        if: ${{ !cancelled() && steps.go.outputs.run == 'true' }}
        env:
          GH_APP_ID: ${{ vars.E2E_GH_APP_ID }}
          E2E_GH_TOKEN: ${{ steps.app.outputs.token }}
          E2E_ZIG_RUNNER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          label="e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-native"
          GH_APP_PRIVATE_KEY_FILE="$RUNNER_TEMP/e2e-app.pem" .github/scripts/e2e.sh start "$RUNNER_TEMP/zig-runner" native "$label"
          status=0
          .github/scripts/e2e.sh check "$label" native || status=$?
          .github/scripts/e2e.sh stop
          exit "$status"

      # The runner masks the jobs' secrets in its own log; any token-shaped string is masked again.
      # The jobs' own workflow commands in it (`##[error]`, `::add-mask::`) are only text here.
      - name: The runner's log, on a failure
        if: ${{ failure() && steps.go.outputs.run == 'true' }}
        run: |
          for f in "$RUNNER_TEMP"/e2e/engine.log "$RUNNER_TEMP"/e2e/rootfs.log "$RUNNER_TEMP"/e2e/runner-*.log; do
            [ -e "$f" ] || continue
            stop="e2e-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::group::$(basename "$f")"
            echo "::stop-commands::$stop"
            tail -n 300 "$f" | sed -E 's/(gh[opsu]|github_pat)_[A-Za-z0-9_]{20,}/***/g'
            echo "::$stop::"
            echo "::endgroup::"
          done

      - name: Clean up
        if: ${{ always() && steps.go.outputs.run == 'true' }}
        run: |
          .github/scripts/e2e.sh stop || true
          rm -f "$RUNNER_TEMP/e2e-app.pem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.go.outputs.run == 'true' }}
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/e2e/timings.tsv
          if-no-files-found: ignore
