# Scorecard: OpenSSF's checks of how the repository is kept (branch protection, pinned
# dependencies, token permissions, signed releases and more), weekly and on every change to main or
# its protection. Results go to the repository's code scanning alerts and the public Scorecard API,
# which the README's badge reads. https://github.com/ossf/scorecard
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  branch_protection_rule:

# Nothing by default; the job asks for what it needs.
permissions: {}

# A newer run replaces one still going: only the latest result matters.
concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the repository
      actions: read # to read the workflows' runs
      security-events: write # to upload the results to code scanning
      id-token: write # to publish the results to the Scorecard API, signed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
