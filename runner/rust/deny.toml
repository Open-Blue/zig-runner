# cargo-deny (https://github.com/EmbarkStudios/cargo-deny) over zr-net's dependencies: licenses
# outside the list, known advisories, crates from anywhere but crates.io, and duplicate versions.
# docs/rust-net.md, "Supply chain"; run by .github/scripts/cargo-deny.sh.
[graph]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

[licenses]
# Permissive licenses only (the project's own is MIT); a crate under any other is a decision.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
